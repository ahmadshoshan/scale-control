<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>نظام وزن السيارات - ميزان شوشان</title>
  
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: 'Tajawal', sans-serif;
    }

    :root {
      --primary-color: #4361ee;
      --success-color: #06d6a0;
      --danger-color: #ef476f;
      --warning-color: #ffd166;
      --dark-color: #2b2d42;
      --light-color: #f8f9fa;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 15px;
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* بطاقة الوزن الرئيسية */
    .weight-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    .weight-display {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-color), #7209b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .weight-unit {
      font-size: 2rem;
      color: #666;
    }

    /* بطاقات السيارات */
    .truck-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      transition: all 0.3s;
      border-right: 5px solid var(--primary-color);
    }

    .truck-card.first-weight {
      border-right-color: var(--warning-color);
      background: linear-gradient(to left, #fff, #fff9e6);
    }

    .truck-card.second-weight {
      border-right-color: var(--success-color);
      background: linear-gradient(to left, #fff, #e6fff9);
    }

    .truck-card.completed {
      border-right-color: var(--success-color);
      background: linear-gradient(to left, #fff, #f0fff4);
    }

    .truck-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--dark-color);
    }

    /* بطاقة الوزن المنفصلة */
    .weight-box {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      border: 2px solid #e0e0e0;
      height: 100%;
      transition: all 0.3s;
    }

    .weight-box.first {
      border-color: var(--warning-color);
    }

    .weight-box.second {
      border-color: var(--success-color);
    }

    .weight-box.net {
      border-color: var(--primary-color);
      background: linear-gradient(135deg, #f0f4ff, #fff);
    }

    .weight-label {
      font-size: 1rem;
      color: #666;
      margin-bottom: 5px;
    }

    .weight-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--dark-color);
      margin: 5px 0;
    }

    .weight-value.net {
      color: var(--success-color);
      font-size: 2.5rem;
    }

    .datetime {
      font-size: 0.85rem;
      color: #888;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed #ddd;
    }

    .datetime i {
      margin-left: 4px;
      font-size: 0.8rem;
    }

    /* معرض الصور */
    .image-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .image-box {
      flex: 1;
      text-align: center;
      background: #f0f0f0;
      border-radius: 10px;
      padding: 10px;
    }

    .image-box img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid transparent;
    }

    .image-box img:hover {
      transform: scale(1.05);
      border-color: var(--primary-color);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .image-box .image-label {
      font-size: 0.8rem;
      color: #666;
      margin-top: 5px;
    }

    .image-placeholder {
      width: 100%;
      height: 100px;
      background: #e0e0e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 2rem;
    }

    /* أزرار الإجراءات */
    .action-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }

    .action-btn {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s;
      cursor: pointer;
    }

    .action-btn:hover {
      transform: scale(1.1);
    }

    .btn-weight {
      background: linear-gradient(135deg, var(--primary-color), #7209b7);
      color: white;
    }

    .btn-print {
      background: linear-gradient(135deg, var(--success-color), #0cb8b8);
      color: white;
    }

    .btn-clear {
      background: linear-gradient(135deg, var(--danger-color), #b5179e);
      color: white;
    }

    .btn-images {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
    }

    /* حقل إدخال رقم السيارة */
    .input-group-custom {
      background: white;
      border-radius: 50px;
      padding: 5px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .input-group-custom input {
      border: none;
      padding: 15px 20px;
      font-size: 1.2rem;
      border-radius: 50px 0 0 50px;
    }

    .input-group-custom button {
      border-radius: 0 50px 50px 0;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), #7209b7);
      color: white;
      border: none;
    }

    /* التبويبات */
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      border: none;
      border-radius: 15px;
      font-weight: 700;
      font-size: 1rem;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(5px);
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* معرض الصور المنبثق */
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      padding: 20px;
    }

    .modal-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 10px;
    }

    .modal-caption {
      color: white;
      margin-top: 15px;
      font-size: 1.2rem;
    }

    /* إشعار toast */
    .toast-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 15px 30px;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: none;
      z-index: 9999;
      font-weight: 600;
    }

    .toast-notification.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { transform: translate(-50%, -100%); opacity: 0; }
      to { transform: translate(-50%, 0%); opacity: 1; }
    }

    /* شاشة التحميل */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .truck-number { font-size: 1.5rem; }
      .weight-value { font-size: 1.5rem; }
      .weight-value.net { font-size: 2rem; }
      .action-btn { width: 40px; height: 40px; }
      .image-box img { height: 70px; }
    }
  </style>
</head>
<body>

  <!-- شاشة التحميل -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
  </div>

  <!-- إشعار toast -->
  <div class="toast-notification" id="toastMessage"></div>

  <!-- معرض الصور المنبثق -->
  <div id="imgModal" class="img-modal" onclick="closeModal(event)">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <img id="modalImg" class="modal-img">
      <div id="modalCaption" class="modal-caption"></div>
    </div>
  </div>

  <div class="main-container">
    
    <!-- عنوان الصفحة -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-white">
        <i class="fas fa-truck me-2"></i>
        نظام وزن السيارات المتطور
      </h1>
      <div>
        <a href="index.html" class="btn btn-light">
          <i class="fas fa-arrow-right"></i>
          لوحة التحكم
        </a>
      </div>
    </div>

    <!-- بطاقة الوزن المباشر -->
    <div class="weight-card">
      <!-- <div class="d-flex justify-content-between align-items-center">
        <span class="badge bg-primary p-3">
          <i class="fas fa-weight-scale"></i> الوزن الحالي
        </span>
        <span class="badge bg-success p-3" id="connectionStatus">
          <i class="fas fa-circle"></i> متصل
        </span>
      </div> -->
      <div class="weight-display" id="currentWeight">
        -- <span class="weight-unit">كجم</span>
      </div>
      <!-- <div class="row g-2 mt-3">
        <div class="col-6">
          <button class="btn btn-primary w-100 py-3" onclick="manualReadWeight()">
            <i class="fas fa-sync-alt"></i> قراءة الوزن
          </button>
        </div>
        <div class="col-6">
          <button class="btn btn-warning w-100 py-3" onclick="zeroScale()">
            <i class="fas fa-broom"></i> تصفير
          </button>
        </div>
      </div> -->
    </div>

    <!-- إضافة سيارة جديدة -->
    <div class="weight-card">
      <!-- <h5 class="mb-3">
        <i class="fas fa-plus-circle text-primary"></i>
        إضافة سيارة جديدة
      </h5> -->
      <div class="input-group-custom d-flex">
        <input type="text" id="newTruckNumber" class="form-control" placeholder="أدخل رقم السيارة" 
               onkeypress="handleEnterPress(event)">
        <button onclick="addFirstWeight()">
          <i class="fas fa-weight-scale"></i>
          وزن أول
        </button>
      </div>
      <small class="text-muted">اضغط Enter للإضافة السريعة</small>
    </div>

    <!-- حقول إضافية للعميل والنوع -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="weight-card">
          <!-- <label class="form-label text-white">العميل</label> -->
          <input list="customers" id="globalCustomer" class="form-control" placeholder="اختر العميل">
          <datalist id="customers">
            <option value="الحاج خالد عبد السلام">
            <option value="عماد نوح">
            <option value="محمد الصندفاوي">
            <option value="محمد منصور">
            <option value="محمود نصير">
          </datalist>
        </div>
      </div>
      <div class="col-md-6">
        <div class="weight-card">
          <!-- <label class="form-label text-white">النوع</label> -->
          <input list="types" id="globalType" class="form-control" placeholder="اختر النوع">
          <datalist id="types">
            <option value="أرز">

          </datalist>

      </div>
    </div>

    <!-- تبويبات عرض السيارات -->
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">
        <i class="fas fa-list"></i> الكل
      </button>
      <button class="tab-btn" id="tabFirst" onclick="switchTab('first')">
        <i class="fas fa-clock"></i> وزن أول

      <!-- <button class="tab-btn" id="tabSecond" onclick="switchTab('second')">
        <i class="fas fa-truck"></i> وزن ثاني

      <button class="tab-btn" id="tabCompleted" onclick="switchTab('completed')">

    <!-- قائمة السيارات -->
    <div id="trucksList">
      <!-- السيارات ستضاف هنا ديناميكياً -->

    <!-- زر تحميل المزيد -->
    <button class="btn btn-light w-100 py-3 mt-3" onclick="loadMore()" id="loadMoreBtn">

  <!-- السكربتات -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  
  <script>
    // تهيئة Socket.IO
    const socket = io();
    let currentWeight = 0;
    let trucks = [];
    let currentTab = 'all';
    let displayLimit = 10;
    let allTrucks = [];

    // تحميل السيارات المحفوظة عند بدء التشغيل
    window.onload = function() {
      loadSavedTrucks();
      setupSocketListeners();
    };

    // إعداد مستمعي Socket.IO
    function setupSocketListeners() {
      // استقبال الوزن من الميزان
      socket.on('response', (data) => {
        if (data && data.length >= 11 && data.length <= 12) {
          const weightDisplay = document.getElementById('currentWeight');
          if (weightDisplay) {
            const cleanWeight = data.replace(/[^0-9.-]/g, '');
            const weight = parseFloat(cleanWeight);
            if (!isNaN(weight)) {
              currentWeight = weight;
              weightDisplay.innerHTML = `${weight.toLocaleString()} <span class="weight-unit">كجم</span>`;
              
              // إضافة تأثير نبض للوزن
              weightDisplay.style.animation = 'pulse 0.5s ease';
              setTimeout(() => weightDisplay.style.animation = '', 500);
            }
          }
        }
      });

    //   socket.on('connect', () => {
    //     document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-circle text-success"></i> متصل';
    //   });

    //   socket.on('disconnect', () => {
    //     document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-circle text-danger"></i> منفصل';
    //   });

      // استقبال تذاكر جديدة من السيرفر
      socket.on('printer:new', (row) => {
        if (row.number && !allTrucks.find(t => t.number === row.number && !t.secondWeight)) {
          const newTruck = {
            id: Date.now().toString(),
            number: row.number,
            firstWeight: parseFloat(row.gross) || 0,
            firstTime: row.time,
            firstDate: row.date,
            firstImage: row.images ? `images/print/${row.images}_cam1.jpg` : null,
            secondWeight: parseFloat(row.tare) || null,
            secondTime: row.time,
            secondDate: row.date,
            secondImage: row.images ? `images/print/${row.images}_cam2.jpg` : null,
            netWeight: parseFloat(row.net) || null,
            netCalculated: true,
            images: row.images,
            customer: row.customer || '',
            type: row.type || ''
          };
          allTrucks.unshift(newTruck);
          saveTrucks();
          filterAndDisplayTrucks();
          showToast(`تم استقبال سيارة جديدة: ${row.number}`, 'success');
        }
      });

      // استقبال بيانات الحساسات
      socket.on('id:new', (row) => {
        if (row.NE && !allTrucks.find(t => t.number === row.NE && !t.secondWeight)) {
          const newTruck = {
            id: Date.now().toString(),
            number: row.NE,
            firstWeight: parseFloat(row.gross) || 0,
            firstTime: new Date().toLocaleTimeString('ar-EG'),
            firstDate: new Date().toLocaleDateString('ar-EG'),
            firstImage: row.images ? `images/sensor/${row.images}_cam1.jpg` : null,
            secondWeight: null,
            secondTime: null,
            secondDate: null,
            secondImage: null,
            netWeight: null,
            netCalculated: false,
            images: row.images,
            customer: '',
            type: ''
          };
          allTrucks.unshift(newTruck);
          saveTrucks();
          filterAndDisplayTrucks();
        }
      });
    }

    // تحميل السيارات المحفوظة من localStorage
    function loadSavedTrucks() {
      const saved = localStorage.getItem('weighingTrucks');
      if (saved) {
        allTrucks = JSON.parse(saved);
        filterAndDisplayTrucks();
      }
    }

    // حفظ السيارات في localStorage
    function saveTrucks() {
      localStorage.setItem('weighingTrucks', JSON.stringify(allTrucks));
    }

    // تصفية وعرض السيارات حسب التبويب المحدد
    function filterAndDisplayTrucks() {
      let filtered = [];
      switch(currentTab) {
        case 'first':
          filtered = allTrucks.filter(t => t.firstWeight && !t.secondWeight);
          break;
        case 'second':
          filtered = allTrucks.filter(t => t.firstWeight && t.secondWeight && !t.netCalculated);
          break;
        case 'completed':
          filtered = allTrucks.filter(t => t.netCalculated);
          break;
        default:
          filtered = [...allTrucks];
      }
      
      trucks = filtered.slice(0, displayLimit);
      displayTrucks();
      
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      if (filtered.length <= displayLimit) {
        loadMoreBtn.style.display = 'none';
      } else {
        loadMoreBtn.style.display = 'block';
      }
    }

    // عرض السيارات في الصفحة
    function displayTrucks() {
      const listElement = document.getElementById('trucksList');
      listElement.innerHTML = '';
      
      if (trucks.length === 0) {
        listElement.innerHTML = `
          <div class="text-center text-white py-5">
            <i class="fas fa-truck fa-4x mb-3"></i>
            <h4>لا توجد سيارات</h4>
            <p>أضف سيارة جديدة باستخدام الحقل أعلاه</p>
          </div>
        `;
        return;
      }

      trucks.forEach(truck => {
        listElement.appendChild(createTruckCard(truck));
      });
    }

    // إنشاء بطاقة سيارة
    function createTruckCard(truck) {
      const card = document.createElement('div');
      card.className = `truck-card ${!truck.secondWeight ? 'first-weight' : truck.netCalculated ? 'completed' : 'second-weight'}`;
      card.id = `truck-${truck.id}`;

      // تنسيق الأوزان
      const firstWeight = truck.firstWeight ? truck.firstWeight.toLocaleString() : '---';
      const secondWeight = truck.secondWeight ? truck.secondWeight.toLocaleString() : '---';
      const netWeight = truck.netWeight ? truck.netWeight.toLocaleString() : '---';

      // تنسيق الوقت والتاريخ
      const firstDateTime = truck.firstTime ? 
        `<div class="datetime"><i class="far fa-clock"></i> ${truck.firstTime} - <i class="far fa-calendar"></i> ${truck.firstDate}</div>` : '';
      
      const secondDateTime = truck.secondTime ? 
        `<div class="datetime"><i class="far fa-clock"></i> ${truck.secondTime} - <i class="far fa-calendar"></i> ${truck.secondDate}</div>` : '';

      card.innerHTML = `
        <div class="row">
          <!-- رقم السيارة والعميل -->
          <div class="col-12 mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <span class="truck-number">🚛 ${truck.number}</span>
                ${truck.customer ? `<span class="badge bg-info me-2">${truck.customer}</span>` : ''}
                ${truck.type ? `<span class="badge bg-success">${truck.type}</span>` : ''}
              </div>
            </div>
          </div>

          <!-- بطاقات الأوزان -->
          <div class="col-12 col-md-4 mb-3">
            <div class="weight-box first">
              <div class="weight-label"><i class="fas fa-arrow-up text-warning"></i> الوزن الأول</div>
              <div class="weight-value">${firstWeight} كجم</div>
              ${firstDateTime}
              <div class="image-box">
                ${truck.firstImage ? 
                  `<img src="${truck.firstImage}" onclick="openImage('${truck.firstImage}', 'الوزن الأول - سيارة ${truck.number}')" title="الوزن الأول">` : 
                  `<div class="image-placeholder"><i class="fas fa-camera"></i></div>`
                }
                <div class="image-label">صورة الدخول</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-4 mb-3">
            <div class="weight-box second">
              <div class="weight-label"><i class="fas fa-arrow-down text-success"></i> الوزن الثاني</div>
              <div class="weight-value">${secondWeight} كجم</div>
              ${secondDateTime}
              <div class="image-box">
                ${truck.secondImage ? 
                  `<img src="${truck.secondImage}" onclick="openImage('${truck.secondImage}', 'الوزن الثاني - سيارة ${truck.number}')" title="الوزن الثاني">` : 
                  `<div class="image-placeholder"><i class="fas fa-camera"></i></div>`
                }
                <div class="image-label">صورة الخروج</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-4 mb-3">
            <div class="weight-box net">
              <div class="weight-label"><i class="fas fa-balance-scale text-primary"></i> الصافي</div>
              <div class="weight-value net">${netWeight} كجم</div>
              <div class="action-buttons">
                ${!truck.secondWeight ? 
                  `<button class="action-btn btn-weight" onclick="captureSecondWeight('${truck.id}')" title="تسجيل الوزن الثاني">
                    <i class="fas fa-weight-scale"></i>
                  </button>` : ''
                }
                ${truck.netWeight ? 
                  `<button class="action-btn btn-print" onclick="printTicket('${truck.id}')" title="طباعة التذكرة">
                    <i class="fas fa-print"></i>
                  </button>` : ''
                }
                <button class="action-btn btn-clear" onclick="clearTruck('${truck.id}')" title="حذف">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      return card;
    }

    // إضافة وزن أول لسيارة جديدة
    async function addFirstWeight() {
      const number = document.getElementById('newTruckNumber').value.trim();
      const customer = document.getElementById('globalCustomer').value;
      const type = document.getElementById('globalType').value;

      if (!number) {
        showToast('الرجاء إدخال رقم السيارة', 'error');
        return;
      }

      if (currentWeight === 0) {
        showToast('الرجاء التأكد من وجود وزن على الميزان', 'warning');
        return;
      }

      const existing = allTrucks.find(t => t.number === number && !t.secondWeight);
      if (existing) {
        showToast('هذه السيارة موجودة بالفعل في قائمة الوزن الأول', 'warning');
        return;
      }

      showLoading(true);
      
      try {
        const imageId = `${Date.now()}_${number}_${currentWeight}`;
        
        // محاولة التقاط الصور
        try {
          await fetch(`/capture-images/${imageId}/first`);
        } catch (e) {
          console.log('فشل التقاط الصور:', e);
        }

        const now = new Date();
        const newTruck = {
          id: Date.now().toString(),
          number: number,
          firstWeight: currentWeight,
          firstTime: now.toLocaleTimeString('ar-EG'),
          firstDate: now.toLocaleDateString('ar-EG'),
          firstImage: `images/print/${imageId}_cam1.jpg`,
          secondWeight: null,
          secondTime: null,
          secondDate: null,
          secondImage: null,
          netWeight: null,
          netCalculated: false,
          images: imageId,
          customer: customer,
          type: type
        };

        allTrucks.unshift(newTruck);
        saveTrucks();
        filterAndDisplayTrucks();
        
        document.getElementById('newTruckNumber').value = '';
        // لا نقوم بمسح حقول العميل والنوع لأنها عامة
        
        showToast(`تم إضافة السيارة رقم ${number} بوزن ${currentWeight} كجم`, 'success');
      } catch (error) {
        console.error('خطأ:', error);
        showToast('حدث خطأ أثناء الإضافة', 'error');
      } finally {
        showLoading(false);
      }
    }

    // التقاط الوزن الثاني لسيارة
    async function captureSecondWeight(id) {
      const truck = allTrucks.find(t => t.id === id);
      if (!truck) return;

      if (currentWeight === 0) {
        showToast('الرجاء التأكد من وجود وزن على الميزان', 'warning');
        return;
      }

      if (truck.secondWeight) {
        showToast('تم أخذ الوزن الثاني مسبقاً', 'warning');
        return;
      }

      showLoading(true);
      
      try {
        const imageId = truck.images || `${Date.now()}_${truck.number}_second`;
        
        // محاولة التقاط الصور
        try {
          await fetch(`/capture-images/${imageId}/second`);
        } catch (e) {
          console.log('فشل التقاط الصور:', e);
        }

        const now = new Date();
        truck.secondWeight = currentWeight;
        truck.secondTime = now.toLocaleTimeString('ar-EG');
        truck.secondDate = now.toLocaleDateString('ar-EG');
        truck.secondImage = `images/print/${imageId}_cam1.jpg`;
        truck.netWeight = Math.abs(truck.firstWeight - truck.secondWeight);
        truck.netCalculated = true;
        truck.images = imageId;
        
        // استخدام العميل والنوع العام إذا لم يكن للسيارة قيم خاصة
        if (!truck.customer) truck.customer = document.getElementById('globalCustomer').value;
        if (!truck.type) truck.type = document.getElementById('globalType').value;
        
        saveTrucks();
        filterAndDisplayTrucks();
        
        showToast(`تم حساب الصافي: ${truck.netWeight} كجم`, 'success');
        
        // فتح نافذة الطباعة تلقائياً
        setTimeout(() => printTicket(id), 1000);
      } catch (error) {
        console.error('خطأ:', error);
        showToast('حدث خطأ أثناء التسجيل', 'error');
      } finally {
        showLoading(false);
      }
    }

    // فتح صورة في المعرض
    function openImage(src, caption) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modalCaption').textContent = caption || '';
      document.getElementById('imgModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    // إغلاق المعرض
    function closeModal(event) {
      if (!event || event.target === document.getElementById('imgModal') || event.target.classList.contains('modal-close')) {
        document.getElementById('imgModal').style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    }

    // إغلاق بالضغط على ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // طباعة تذكرة لسيارة
    function printTicket(id) {
      const truck = allTrucks.find(t => t.id === id);
      if (!truck || !truck.netWeight) return;

      const ticketData = {
        number: truck.number,
        gross: truck.firstWeight,
        tare: truck.secondWeight,
        net: truck.netWeight,
        date: truck.firstDate,
        time: truck.firstTime,
        customer: truck.customer || '',
        type: truck.type || '',
        images: truck.images,
        firstTime: truck.firstTime,
        secondTime: truck.secondTime
      };

      localStorage.setItem('ticketData', JSON.stringify(ticketData));
      window.open('ticket.html', '_blank', 'width=650,height=650');
    }

    // حذف سيارة
    function clearTruck(id) {
      if (!confirm('هل أنت متأكد من حذف هذه السيارة؟')) return;
      
      allTrucks = allTrucks.filter(t => t.id !== id);
      saveTrucks();
      filterAndDisplayTrucks();
      showToast('تم حذف السيارة', 'success');
    }

    // التبديل بين التبويبات
    function switchTab(tab) {
      currentTab = tab;
      displayLimit = 10;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');
      
      filterAndDisplayTrucks();
    }

    // تحميل المزيد من السيارات
    function loadMore() {
      displayLimit += 10;
      filterAndDisplayTrucks();
    }

    // // قراءة الوزن يدوياً
    // function manualReadWeight() {
    //   fetch('/send-command?command=XN2')
    //     .then(() => showToast('جاري قراءة الوزن...', 'info'));
    // }

    // // تصفير الميزان
    // function zeroScale() {
    //   if (!confirm('هل أنت متأكد من تصفير الميزان؟')) return;
    //   fetch('/send-command?command=KZERO')
    //     .then(() => showToast('تم تصفير الميزان', 'success'));
    // }

    // معالجة الضغط على Enter في حقل الإدخال
    function handleEnterPress(event) {
      if (event.key === 'Enter') {
        addFirstWeight();
      }
    }

    // إظهار رسالة toast
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toastMessage');
      toast.textContent = message;
      toast.className = `toast-notification show bg-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'primary'} text-white`;
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // إظهار/إخفاء شاشة التحميل
    function showLoading(show) {
      document.getElementById('loadingScreen').style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
