<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الميزان - جدول البيانات</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --success-color: #27ae60;
      --danger-color: #e74c3c;
      --warning-color: #f39c12;
      --dark-color: #34495e;
      --light-color: #ecf0f1;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    /* الحاوية الرئيسية */
    .main-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      margin-bottom: 10px;
    }

    /* ترويسة الصفحة */
    .page-header {
      background: linear-gradient(45deg, var(--primary-color), var(--dark-color));
      color: white;
      padding: 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      box-shadow: 0 10px 30px rgba(44, 62, 80, 0.3);
    }

    .page-header h2 {
      margin: 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .page-header h2 i {
      font-size: 2.5rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 50%;
    }

    /* أزرار التنقل المحسنة */
    .nav-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 12px 25px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .nav-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .btn-dashboard {
      background: linear-gradient(45deg, var(--primary-color), var(--dark-color));
      color: white;
    }

    .btn-tickets {
      background: linear-gradient(45deg, var(--success-color), #2ecc71);
      color: white;
    }

    /* بطاقات الإحصائيات */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      /* background: white; */
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: linear-gradient(45deg, var(--secondary-color), #9b59b6);
      opacity: 0.1;
      border-radius: 50%;
      transform: translate(30px, -30px);
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .stat-icon {
      font-size: 2.5rem;
      color: var(--secondary-color);
      margin-bottom: 15px;
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary-color);
      margin: 10px 0;
    }

    .stat-label {
      color: #7f8c8d;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* شريط البحث والتصفية */
    .search-section {
     
      border-radius: 10px;
      padding:5px;
      margin-bottom: 5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .search-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-filters {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-label {
      font-weight: 600;
      color: var(--dark-color);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .filter-input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      transition: all 0.3s;
      font-size: 0.95rem;
    }

    .filter-input:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      outline: none;
    }

    .filter-select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    .search-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-btn {
      padding: 12px 30px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .search-btn-primary {
      background: linear-gradient(45deg, var(--secondary-color), #9b59b6);
      color: white;
    }

    .search-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
    }

    .search-btn-reset {
      background: #e0e0e0;
      color: var(--dark-color);
    }

    .search-btn-reset:hover {
      background: #d0d0d0;
    }

    /* الجدول المحسن */
    .table-container {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .modern-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
    }

    .modern-table thead th {
      background: linear-gradient(45deg, var(--primary-color), var(--dark-color));
      color: white;
      padding: 18px 15px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      white-space: nowrap;
    }

    .modern-table thead th:first-child {
      border-radius: 15px 0 0 15px;
    }

    .modern-table thead th:last-child {
      border-radius: 0 15px 15px 0;
    }

    .modern-table tbody tr {
      background: white;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
      border-radius: 15px;
    }

    .modern-table tbody tr:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .modern-table tbody td {
      padding: 18px 15px;
      vertical-align: middle;
      border: none;
      color: #2c3e50;
    }

    /* تحسين عرض الصور */
    .image-gallery {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .image-thumb {
      width: 70px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid transparent;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .image-thumb:hover {
      transform: scale(1.2);
      border-color: var(--secondary-color);
      box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
      z-index: 10;
    }

    /* شارات البيانات */
    .badge-custom {
      padding: 8px 12px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-block;
    }

    .badge-weight {
      background: linear-gradient(45deg, var(--secondary-color), #9b59b6);
      color: white;
    }

    .badge-type {
      background: linear-gradient(45deg, var(--success-color), #2ecc71);
      color: white;
    }

    .badge-date {
      background: linear-gradient(45deg, var(--warning-color), #f1c40f);
      color: var(--dark-color);
    }

    /* زر تحميل المزيد المحسن */
    .load-more-btn {
      background: linear-gradient(45deg, var(--primary-color), var(--dark-color));
      color: white;
      border: none;
      padding: 18px;
      border-radius: 15px;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.3s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(44, 62, 80, 0.3);
    }

    .load-more-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(44, 62, 80, 0.4);
    }

    .load-more-btn i {
      font-size: 1.2rem;
    }

    /* معرض الصور المنبثق المحسن */
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      padding: 30px;
      backdrop-filter: blur(10px);
    }

    .modal-content-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-image {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
      position: absolute;
      top: 30px;
      left: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    /* مؤشر التحميل */
    .loading-spinner {
      display: none;
      text-align: center;
      padding: 30px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--secondary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* تنسيق النص عند عدم وجود بيانات */
    .no-data {
      text-align: center;
      padding: 50px !important;
      color: #95a5a6;
    }

    .no-data i {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    /* تأثيرات إضافية */
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* تحسين العرض على الجوال */
    @media (max-width: 768px) {
      .main-container {
        padding: 15px;
      }
      
      .page-header h2 {
        font-size: 1.5rem;
      }
      
      .stat-number {
        font-size: 1.8rem;
      }
      
      .image-thumb {
        width: 50px;
        height: 45px;
      }
    }
  </style>
</head>
<body>

  <div class="container-fluid">
    <div class="main-container">

      <!-- ترويسة الصفحة المحسنة -->
      <div class="page-header d-flex flex-wrap justify-content-between align-items-center">
        <h2>
          <i class="fas fa-weight-scale"></i>
          نظام إدارة الميزان - جدول البيانات
        </h2>
        <div class="nav-buttons">
          <a href="index.html" class="nav-btn btn-dashboard">
            <i class="fas fa-tachometer-alt"></i>
            لوحة التحكم
          </a>
          <a href="table2.html" class="nav-btn btn-tickets">
            <i class="fas fa-ticket-alt"></i>
            جدول التذاكر
          </a>
        </div>
      </div>

      <!-- بطاقات الإحصائيات -->
      <div class="stats-grid">
        <div class="stat-card fade-in">
          <div class="stat-icon">
            <i class="fas fa-database"></i>
            <b class="stat-label">إجمالي السجلات</b>
          </div>
          <div class="stat-number" id="totalRecords">0</div>
        </div>
        <div class="stat-card fade-in" style="animation-delay: 0.1s;">
          <div class="stat-icon">
            <i class="fas fa-truck"></i>
            <b class="stat-label">عدد السيارات</b>
          </div>
          <div class="stat-number" id="uniqueCars">0</div>
        </div>
        <div class="stat-card fade-in" style="animation-delay: 0.2s;">
          <div class="stat-icon">
            <i class="fas fa-calendar-check"></i>
            <b class="stat-label">سجلات اليوم</b>
          </div>
          <div class="stat-number" id="todayRecords">0</div>
        </div>
        <div class="stat-card fade-in" style="animation-delay: 0.3s;">
          <div class="stat-icon">
            <i class="fas fa-camera"></i>
            <b class="stat-label">إجمالي الصور</b>
          </div>
          <div class="stat-number" id="totalImages">0</div>
        </div>
      </div>

      <!-- قسم البحث والتصفية -->
      <div class="search-section">
   
        <div class="search-filters">
          <div class="filter-group">
            <div class="filter-label">نوع البحث</div>
            <select id="searchType" class="filter-select">
              <option value="number">🚛 رقم السيارة</option>
              <option value="date">📅 التاريخ</option>
              <option value="type">📦 النوع</option>
              <option value="customer">👤 العميل</option>
            </select>
          </div>
          <div class="filter-group">
            <div class="filter-label">قيمة البحث</div>
            <input type="text" id="searchValue" class="filter-input" placeholder="أدخل كلمة البحث...">
          </div>
          <div class="search-actions">
            <button class="search-btn search-btn-primary" onclick="searchData()">
              <i class="fas fa-search"></i>
              بحث
            </button>
            <button class="search-btn search-btn-reset" onclick="resetSearch()">
              <i class="fas fa-redo-alt"></i>
              إعادة تعيين
            </button>
          </div>
        </div>
      </div>

      <!-- الجدول المحسن -->
      <div class="table-container">
        <table class="modern-table">
          <thead>
            <tr>
              <th>المعرف</th>
              <th>رقم السيارة</th>
              <th>القيمة</th>
              <th>التاريخ</th>
              <th>النوع</th>
              <th>العميل</th>
              <th>الصور</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- البيانات ستضاف هنا ديناميكياً -->
          </tbody>
        </table>
        
        <!-- مؤشر التحميل -->
        <div id="loadingSpinner" class="loading-spinner">
          <div class="spinner"></div>
          <p class="mt-3">جاري التحميل...</p>
        </div>
      </div>

      <!-- زر تحميل المزيد المحسن -->
      <button id="load-more-btn" class="load-more-btn">
        <i class="fas fa-arrow-down"></i>
        تحميل المزيد من البيانات
        <i class="fas fa-arrow-down"></i>
      </button>
    </div>
  </div>

  <!-- معرض الصور المنبثق المحسن -->
  <div id="imgModal" class="img-modal" onclick="closeModal(event)">
    <div class="modal-content-wrapper">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <img id="modalImg" class="modal-image">
    </div>
  </div>

  <script>
    let offset = 0;
    const limit = 5;
    let allData = [];
    let currentData = [];

    // تحسين دالة جلب البيانات
    async function fetchData(reset = false) {
      if (reset) {
        offset = 0;
        document.getElementById('table-body').innerHTML = '';
      }

      showLoading(true);

      try {
        const response = await fetch(`/get-data?limit=${limit}&offset=${offset}`);
        const data = await response.json();
        
        if (data.length === 0) {
          if (offset === 0) {
            showNoData();
          }
          document.getElementById('load-more-btn').style.display = 'none';
          showLoading(false);
          return;
        }

        // تخزين البيانات
        if (reset) {
          allData = data;
          currentData = data;
        } else {
          allData = [...allData, ...data];
          currentData = [...currentData, ...data];
        }

        // عرض البيانات
        displayData(data);
        
        // تحديث الإحصائيات
        updateStats();
        
        offset += limit;
        document.getElementById('load-more-btn').style.display = 'block';
        showLoading(false);

      } catch (error) {
        console.error('خطأ:', error);
        showError('حدث خطأ في تحميل البيانات');
        showLoading(false);
      }
    }

    // دالة عرض البيانات المحسنة
    function displayData(data) {
      const tableBody = document.getElementById('table-body');

      data.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.className = 'fade-in';
        tr.style.animationDelay = `${index * 0.05}s`;
        
        tr.innerHTML = `
          <td><span class="badge-custom" style="background: #3498db; color: white;">#${row.id}</span></td>
          <td><span class="badge-custom" style="background: #2c3e50; color: white;"><i class="fas fa-truck"></i> ${row.number}</span></td>
          <td><span class="badge-custom badge-weight"><i class="fas fa-weight-scale"></i> ${row.data_value}</span></td>
          <td><span class="badge-custom badge-date"><i class="fas fa-calendar"></i> ${row.date}</span></td>
          <td><span class="badge-custom badge-type"><i class="fas fa-tag"></i> ${row.type || 'غير محدد'}</span></td>
          <td><i class="fas fa-user"></i> ${row.customer || 'غير محدد'}</td>
          <td>
            <div class="image-gallery">
              <img src="images/sensor/${row.images}_cam1.jpg" class="image-thumb" onclick="openImg(this.src)" title="الصورة 1">
              <img src="images/sensor/${row.images}_cam2.jpg" class="image-thumb" onclick="openImg(this.src)" title="الصورة 2">
              <img src="images/sensor/${row.images}_cam3.jpg" class="image-thumb" onclick="openImg(this.src)" title="الصورة 3">
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    // تحديث الإحصائيات
    function updateStats() {
      const totalRecords = allData.length;
      const uniqueCars = new Set(allData.map(item => item.number)).size;
      
      const today = new Date().toISOString().split('T')[0];
      const todayRecords = allData.filter(item => item.date === today).length;
      
      const totalImages = allData.reduce((acc, item) => {
        return acc + (item.images ? 3 : 0); // كل سجل له 3 صور
      }, 0);

      document.getElementById('totalRecords').textContent = totalRecords;
      document.getElementById('uniqueCars').textContent = uniqueCars;
      document.getElementById('todayRecords').textContent = todayRecords;
      document.getElementById('totalImages').textContent = totalImages;
    }

    // دالة البحث المحسنة
    async function searchData() {
      const searchType = document.getElementById('searchType').value;
      const searchValue = document.getElementById('searchValue').value.trim();

      if (!searchValue) {
        alert('الرجاء إدخال قيمة للبحث');
        return;
      }

      showLoading(true);
      
      try {
        const response = await fetch(`/get-data3?type=${encodeURIComponent(searchType)}&value=${encodeURIComponent(searchValue)}`);
        const data = await response.json();
        
        const tableBody = document.getElementById('table-body');
        tableBody.innerHTML = '';

        if (data.length === 0) {
          showNoData('لا توجد نتائج للبحث');
          document.getElementById('load-more-btn').style.display = 'none';
        } else {
          displayData(data);
          document.getElementById('load-more-btn').style.display = 'none';
        }
        
        showLoading(false);
        
      } catch (error) {
        console.error('خطأ في البحث:', error);
        showError('حدث خطأ في عملية البحث');
        showLoading(false);
      }
    }

    // إعادة تعيين البحث
    function resetSearch() {
      document.getElementById('searchValue').value = '';
      document.getElementById('searchType').value = 'number';
      
      const tableBody = document.getElementById('table-body');
      tableBody.innerHTML = '';
      
      offset = 0;
      fetchData(true);
    }

    // دوال مساعدة للتحميل والأخطاء
    function showLoading(show) {
      document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    function showNoData(message = 'لا توجد بيانات لعرضها') {
      const tableBody = document.getElementById('table-body');
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" class="no-data">
            <i class="fas fa-database"></i>
            <p>${message}</p>
          </td>
        </tr>
      `;
    }

    function showError(message) {
      const tableBody = document.getElementById('table-body');
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" class="no-data" style="color: #e74c3c;">
            <i class="fas fa-exclamation-circle"></i>
            <p>${message}</p>
          </td>
        </tr>
      `;
    }

    // دوال معرض الصور المحسنة
    function openImg(src) {
      document.body.style.overflow = 'hidden';
      const modalImg = document.getElementById("modalImg");
      modalImg.src = src;
      modalImg.alt = "صورة الميزان";
      document.getElementById("imgModal").style.display = "flex";
    }

    function closeModal(event) {
      if (!event || event.target === document.getElementById('imgModal') || event.target.classList.contains('modal-close')) {
        document.body.style.overflow = 'auto';
        document.getElementById("imgModal").style.display = "none";
      }
    }

    // إغلاق المودال بزر ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // تحميل البيانات عند تحميل الصفحة
    window.onload = () => fetchData(true);
    
    // إضافة حدث لزر تحميل المزيد
    document.getElementById('load-more-btn').addEventListener('click', () => fetchData(false));
  </script>

</body>
</html>
