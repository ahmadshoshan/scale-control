  <style>


    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --success-color: #27ae60;
      --danger-color: #e74c3c;
      --warning-color: #f39c12;
      --dark-color: #34495e;
      --light-color: #ecf0f1;
      --mobile-spacing: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 10px;
      margin: 0;
      overflow-x: hidden;
    }

    /* الحاوية الرئيسية المحسنة للجوال */
    .main-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 12px 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      margin-bottom: 8px;
      width: 100%;
    }

    /* ترويسة الصفحة المحسنة للجوال */
    .page-header {
      background: linear-gradient(45deg, var(--primary-color), var(--dark-color));
      color: white;
      padding: 15px 12px;
      border-radius: 5px;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(44, 62, 80, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 576px) {
      .page-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
      }
    }

    .page-header h2 {
      margin: 0;
      font-weight: 700;
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-header h2 i {
      font-size: clamp(1.5rem, 6vw, 2.5rem);
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* أزرار التنقل المحسنة للجوال */
    .nav-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: 600;
      font-size: clamp(0.8rem, 3.5vw, 1rem);
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      flex: 1 1 auto;
      min-width: 120px;
      min-height: 44px;
    }

    @media (max-width: 480px) {
      .nav-btn {
        min-width: 100px;
        padding: 10px 12px;
      }
    }

    .btn-dashboard {
      background: linear-gradient(45deg, var(--primary-color), var(--dark-color));
      color: white;
    }

    .btn-tickets {
      background: linear-gradient(45deg, var(--success-color), #2ecc71);
      color: white;
    }

    /* بطاقات الإحصائيات المحسنة للجوال */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 5px;
    }

    @media (min-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }
    }

    .stat-card {
      /* background: white; */
      border-radius: 16px;
      /* padding: 15px 10px; */
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      text-align: center;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: linear-gradient(45deg, var(--secondary-color), #9b59b6);
      opacity: 0.1;
      border-radius: 50%;
      transform: translate(20px, -20px);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .stat-icon {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      color: var(--secondary-color);
      /* margin-bottom: 8px; */
      display: flex;
      flex-direction: column;
      align-items: center;
      /* gap: 5px; */
    }

    .stat-icon i {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
    }

    .stat-number {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 700;
      color: var(--primary-color);
      /* margin: 5px 0; */
      line-height: 1.2;
    }

    .stat-label {
      color: #7f8c8d;
      font-size: clamp(0.7rem, 2.5vw, 1rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* شريط البحث والتصفية المحسن للجوال */
    .search-section {
      background: white;
      border-radius: 16px;
      padding: 15px 12px;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .search-title {
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-filters {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 768px) {
      .search-filters {
        flex-direction: row;
        gap: 15px;
        align-items: flex-end;
      }
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-label {
      font-weight: 600;
      color: var(--dark-color);
      margin-bottom: 5px;
      font-size: clamp(0.8rem, 3vw, 0.9rem);
    }

    .filter-input,
    .filter-select {
      width: 100%;
      padding: 12px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      transition: all 0.3s;
      font-size: 16px; /* منع التكبير التلقائي في iOS */
      background: white;
      min-height: 44px;
    }

    .filter-input:focus,
    .filter-select:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      outline: none;
    }

    .search-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      .search-actions {
        flex-direction: column;
        width: 100%;
      }
      
      .search-actions button {
        width: 100%;
      }
    }

    .search-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      flex: 1 1 auto;
    }

    .search-btn-primary {
      background: linear-gradient(45deg, var(--secondary-color), #9b59b6);
      color: white;
    }

    .search-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
    }

    .search-btn-reset {
      background: #e0e0e0;
      color: var(--dark-color);
    }

    .search-btn-reset:hover {
      background: #d0d0d0;
    }

    /* الجدول المحسن للجوال مع تمرير أفقي */
    .table-container {
      background: white;
      border-radius: 16px;
      padding: 15px 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modern-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      min-width: 700px; /* للتمرير الأفقي على الجوال */
    }

    .modern-table thead th {
      background: linear-gradient(45deg, var(--primary-color), var(--dark-color));
      color: white;
      padding: 12px 8px;
      font-weight: 600;
      font-size: clamp(0.75rem, 2.8vw, 0.9rem);
      border: none;
      white-space: nowrap;
    }

    .modern-table thead th:first-child {
      border-radius: 10px 0 0 10px;
    }

    .modern-table thead th:last-child {
      border-radius: 0 10px 10px 0;
    }

    .modern-table tbody tr {
      background: white;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
      border-radius: 10px;
    }

    .modern-table tbody tr:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .modern-table tbody td {
      padding: 12px 8px;
      vertical-align: middle;
      border: none;
      color: #2c3e50;
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
    }

    /* تحسين عرض الصور للجوال */
    .image-gallery {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .image-thumb {
      width: 45px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    }

    @media (min-width: 768px) {
      .image-thumb {
        width: 70px;
        height: 60px;
      }
    }

    .image-thumb:hover {
      transform: scale(1.1);
      border-color: var(--secondary-color);
      z-index: 10;
    }

    /* شارات البيانات المحسنة للجوال */
    .badge-custom {
      padding: 5px 8px;
      border-radius: 30px;
      font-weight: 600;
      font-size: clamp(0.65rem, 2.3vw, 0.8rem);
      display: inline-block;
      white-space: nowrap;
    }

    .badge-weight {
      background: linear-gradient(45deg, var(--secondary-color), #9b59b6);
      color: white;
    }

    .badge-type {
      background: linear-gradient(45deg, var(--success-color), #2ecc71);
      color: white;
    }

    .badge-date {
      background: linear-gradient(45deg, var(--warning-color), #f1c40f);
      color: var(--dark-color);
    }

    /* زر تحميل المزيد المحسن للجوال */
    .load-more-btn {
      background: linear-gradient(45deg, var(--primary-color), var(--dark-color));
      color: white;
      border: none;
      padding: 15px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: clamp(0.9rem, 4vw, 1.1rem);
      transition: all 0.3s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(44, 62, 80, 0.3);
      min-height: 50px;
    }

    .load-more-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(44, 62, 80, 0.4);
    }

    .load-more-btn i {
      font-size: clamp(1rem, 4vw, 1.2rem);
    }

    /* معرض الصور المنبثق المحسن للجوال */
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      padding: 15px;
      backdrop-filter: blur(10px);
    }

    .modal-content-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-image {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 30px;
      color: white;
      cursor: pointer;
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      z-index: 10000;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: rotate(90deg);
    }

    /* مؤشر التحميل المحسن */
    .loading-spinner {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--secondary-color);
      border-radius: 50%;

      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* تنسيق النص عند عدم وجود بيانات */
    .no-data {
      text-align: center;
      padding: 30px 15px !important;
      color: #95a5a6;
    }

    .no-data i {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .no-data p {
      font-size: clamp(0.85rem, 3vw, 1rem);
    }

  

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* تحسين شريط التمرير */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(45deg, var(--secondary-color), var(--primary-color));
      border-radius: 10px;
    }

    /* تحسينات إضافية للجوال */
    @media (max-width: 480px) {
      .main-container {
        padding: 8px 6px;
      }
      
      .page-header {
        padding: 5px 10px;
      }
      
      .stat-card {
        padding: 12px 5px;
      }
      
      /* تكبير مناطق اللمس */
      button, 
      .nav-btn,
      .search-btn,
      .load-more-btn,
      .image-thumb {
        touch-action: manipulation;
      }
      
      /* تحسين ظهور الشارات */
      .badge-custom i {
        margin-left: 3px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

  <script>
    let offset = 0;
    const limit = 10;
    let allData = [];
    let currentData = [];

    // تحسين دالة جلب البيانات
    async function fetchData(reset = false) {
      if (reset) {
        offset = 0;
        document.getElementById('table-body').innerHTML = '';
      }

      showLoading(true);

      try {
        const response = await fetch(`/get-data?limit=${limit}&offset=${offset}`);
        const data = await response.json();
        
        if (data.length === 0) {
          if (offset === 0) {
            showNoData();
          }
          document.getElementById('load-more-btn').style.display = 'none';
          showLoading(false);
          return;
        }

        // تخزين البيانات
        if (reset) {
          allData = data;
          currentData = data;
        } else {
          allData = [...allData, ...data];
          currentData = [...currentData, ...data];
        }

        // عرض البيانات
        displayData(data);
        
        // تحديث الإحصائيات
        updateStats();
        
        offset += limit;
        document.getElementById('load-more-btn').style.display = 'block';
        showLoading(false);

      } catch (error) {
        console.error('خطأ:', error);
        showError('حدث خطأ في تحميل البيانات');
        showLoading(false);
      }
    }

    // دالة عرض البيانات المحسنة للجوال
    function displayData(data) {
      const tableBody = document.getElementById('table-body');

      data.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.className = 'fade-in';
     
        
        // معالجة الصور - التحقق من وجودها
        const img1 = row.images ? `images/sensor/${row.images}_cam1.jpg` : '';
        const img2 = row.images ? `images/sensor/${row.images}_cam2.jpg` : '';
        const img3 = row.images ? `images/sensor/${row.images}_cam3.jpg` : '';
        
        tr.innerHTML = `
          <td><span class="badge-custom" style="background: #3498db; color: white;">#${row.id || ''}</span></td>
          <td><span class="badge-custom" style="background: #2c3e50; color: white;"><i class="fas fa-truck"></i> ${row.number || ''}</span></td>
          <td><span class="badge-custom badge-weight"><i class="fas fa-weight-scale"></i> ${row.data_value || '0'}</span></td>
          <td><span class="badge-custom badge-date"><i class="fas fa-calendar"></i> ${row.date || '--/--/----'}</span></td>
          <td><span class="badge-custom badge-type"><i class="fas fa-tag"></i> ${row.type || 'غير محدد'}</span></td>
          <td><i class="fas fa-user"></i> ${row.customer ? row.customer.substring(0, 10) + (row.customer.length > 10 ? '...' : '') : 'غير محدد'}</td>
          <td>
            <div class="image-gallery">
              ${img1 ? `<img src="${img1}" class="image-thumb" onclick="openImg(this.src)" title="الصورة 1" onerror="this.style.display='none'">` : ''}
              ${img2 ? `<img src="${img2}" class="image-thumb" onclick="openImg(this.src)" title="الصورة 2" onerror="this.style.display='none'">` : ''}
              ${img3 ? `<img src="${img3}" class="image-thumb" onclick="openImg(this.src)" title="الصورة 3" onerror="this.style.display='none'">` : ''}
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    // دالة البحث المحسنة
    async function searchData() {
      const searchType = document.getElementById('searchType').value;
      const searchValue = document.getElementById('searchValue').value.trim();

      if (!searchValue) {
        alert('الرجاء إدخال قيمة للبحث');
        return;
      }

      showLoading(true);
      
      try {
        const response = await fetch(`/get-data4?type=${encodeURIComponent(searchType)}&value=${encodeURIComponent(searchValue)}`);
        const data = await response.json();
        
        const tableBody = document.getElementById('table-body');
        tableBody.innerHTML = '';

        if (data.length === 0) {
          showNoData('لا توجد نتائج للبحث');
          document.getElementById('load-more-btn').style.display = 'none';
        } else {
          displayData(data);
          document.getElementById('load-more-btn').style.display = 'none';
        }
        
        showLoading(false);
        
      } catch (error) {
        console.error('خطأ في البحث:', error);
        showError('حدث خطأ في عملية البحث');
        showLoading(false);
      }
    }

    // إعادة تعيين البحث
    function resetSearch() {
      document.getElementById('searchValue').value = '';
      document.getElementById('searchType').value = 'number';
      
      const tableBody = document.getElementById('table-body');
      tableBody.innerHTML = '';
      
      offset = 0;
      fetchData(true);
    }

    // دوال مساعدة للتحميل والأخطاء
    function showLoading(show) {
      document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
    }

    function showNoData(message = 'لا توجد بيانات لعرضها') {
      const tableBody = document.getElementById('table-body');
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" class="no-data">
            <i class="fas fa-database"></i>
            <p>${message}</p>
          </td>
        </tr>
      `;
    }

    function showError(message) {
      const tableBody = document.getElementById('table-body');
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" class="no-data" style="color: #e74c3c;">
            <i class="fas fa-exclamation-circle"></i>
            <p>${message}</p>
          </td>
        </tr>
      `;
    }

    // دوال معرض الصور المحسنة
    function openImg(src) {
      if (!src) return;
      document.body.style.overflow = 'hidden';
      const modalImg = document.getElementById("modalImg");
      modalImg.src = src;
      document.getElementById("imgModal").style.display = "flex";
    }

    function closeModal(event) {
      if (!event || event.target === document.getElementById('imgModal') || event.target.classList.contains('modal-close')) {
        document.body.style.overflow = 'auto';
        document.getElementById("imgModal").style.display = "none";
      }
    }

    // إغلاق المودال بزر ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // منع التكبير التلقائي في iOS
    document.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('touchstart', function() {
        this.style.fontSize = '16px';
      });
    });

    // تحميل البيانات عند تحميل الصفحة
    window.onload = () => fetchData(true);
    
    // إضافة حدث لزر تحميل المزيد
    document.getElementById('load-more-btn').addEventListener('click', () => fetchData(false));
  </script>
