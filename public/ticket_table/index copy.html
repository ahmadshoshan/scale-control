<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحكم الميزان المتطور - IQ plus 710</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: rgba(0, 0, 0, 0.8) !important;
            backdrop-filter: blur(10px);
        }
        
        .main-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* لوحة تحكم الميزان IQ plus 710 */
        .scale-control-panel {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 3px solid #333;
        }
        
        .panel-header {
            background: linear-gradient(45deg, #2c3e50, #34495e);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #444;
        }
        
        .panel-header h4 {
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .panel-header i {
            color: #00d2ff;
            margin-left: 10px;
        }
        
        /* شاشة العرض */
        .scale-display {
            background: #000;
            border: 3px solid #444;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 30px rgba(0,255,255,0.1);
        }
        
        .weight-value {
            color: #0ff;
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(0,255,255,0.8);
            animation: pulse 2s infinite;
        }
        
        .weight-unit {
            color: #0ff;
            font-size: 1.5rem;
            margin-right: 10px;
        }
        
        .scale-mode {
            color: #0ff;
            font-size: 1.3rem;
            text-align: center;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
        }
        
        .scale-ne {
            color: #ff0;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 5px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* الأزرار */
        .control-btn {
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .btn-main {
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
            color: #000;
            padding: 15px;
            font-size: 1rem;
        }
        
        .btn-main i {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .btn-print {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 15px;
            font-size: 1rem;
        }
        
        .btn-secondary-scale {
            background: linear-gradient(45deg, #6c757d, #5a6268);
            color: white;
            padding: 10px;
            font-size: 0.85rem;
        }
        
        .btn-danger-scale {
            background: linear-gradient(45deg, #dc3545, #c82333);
            color: white;
            padding: 10px;
            font-size: 0.85rem;
        }
        
        .btn-macro {
            background: linear-gradient(45deg, #343a40, #23272b);
            color: white;
            padding: 12px;
            font-size: 0.9rem;
        }
        
        .btn-number {
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            color: #000;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        /* الأقسام */
        .section-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        
        .section-title {
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #00d2ff;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-left: 10px;
            color: #00d2ff;
        }
        
        /* روابط التنقل */
        .nav-link-custom {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            margin: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .nav-link-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            color: white;
        }
        
        .nav-link-custom i {
            margin-left: 10px;
            font-size: 1.2rem;
        }
        
        /* حالة التحميل */
        .loading-status {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: #6c757d;
        }
        
        .loading-status i {
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* سجل الأوامر */
        .command-log {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .weight-value {
                font-size: 2.5rem;
            }
            .control-btn {
                padding: 10px;
                font-size: 0.85rem;
            }
            .btn-number {
                padding: 12px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-weight-hanging me-2"></i>
                ميزان شوشان
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <i class="fas fa-home me-1"></i>
                            لوحة التحكم
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="row">
            <!-- لوحة تحكم الميزان IQ plus 710 -->
            <div class="col-lg-8 col-md-12 mb-4">
                <div class="scale-control-panel">
                    <!-- رأس اللوحة -->
                    <div class="panel-header">
                        <h4><i class="fas fa-microchip"></i> IQ plus 710 - مؤشر الوزن القابل للبرمجة</h4>
                    </div>

                    <!-- شاشة العرض -->
                    <div class="scale-display">
                        <div class="weight-value">
                            <span id="response">0.000</span>
                            <span class="weight-unit">kg</span>
                        </div>
                        <div class="scale-mode" id="scaleMode">Gross</div>
                        <div class="scale-ne" id="response11">
                            <span class="badge bg-primary">---</span>
                        </div>
                    </div>

                    <!-- الأزرار الرئيسية -->
                    <div class="row g-2 mb-3">
                        <div class="col-4">
                            <button class="btn control-btn btn-main w-100" onclick="sendScaleCommand('kzero')">
                                <i class="fas fa-balance-scale"></i>
                                ZERO<br><small class="text-muted">&gt;0&lt;</small>
                            </button>
                        </div>
                        <div class="col-4">
                            <button class="btn control-btn btn-main w-100" onclick="sendScaleCommand('kgross')">
                                <i class="fas fa-exchange-alt"></i>
                                GROSS<br><small class="text-muted">NET</small>
                            </button>
                        </div>
                        <div class="col-4">
                            <button class="btn control-btn btn-main w-100" onclick="sendScaleCommand('ktare')">
                                <i class="fas fa-arrow-up"></i>
                                TARE<br><small class="text-muted">⇧</small>
                            </button>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <button class="btn control-btn btn-secondary-scale w-100" onclick="sendScaleCommand('kunits')">
                                <i class="fas fa-ruler-horizontal me-1"></i>
                                UNITS
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn control-btn btn-print w-100" onclick="sendScaleCommand('kprint')">
                                <i class="fas fa-print me-1"></i>
                                PRINT<br><small>○</small>
                            </button>
                        </div>
                    </div>

                    <!-- الأزرار الثانوية -->
                    <div class="row g-2 mb-3">
                        <div class="col-3">
                            <button class="btn control-btn btn-secondary-scale w-100" onclick="sendScaleCommand('kid')">
                                I.D.
                            </button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-secondary-scale w-100" onclick="sendScaleCommand('ksetpoint')">
                                SET POINT
                            </button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-secondary-scale w-100" onclick="sendScaleCommand('ktime')">
                                TIME DATE
                            </button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-secondary-scale w-100" onclick="sendScaleCommand('kescape')">
                                ESC
                            </button>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-3">
                            <button class="btn control-btn btn-secondary-scale w-100" onclick="sendScaleCommand('kalpha')">
                                ALPHA
                            </button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-secondary-scale w-100" onclick="sendScaleCommand('kaccum')">
                                ACCUM
                            </button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-secondary-scale w-100" onclick="sendScaleCommand('kdisplay')">
                                DISPLAY
                            </button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-danger-scale w-100" onclick="sendScaleCommand('kclr')">
                                CLEAR
                            </button>
                        </div>
                    </div>

                    <!-- أزرار MACRO -->
                    <div class="row g-2 mb-3">
                        <div class="col-3">
                            <button class="btn control-btn btn-macro w-100" onclick="sendScaleCommand('kf1')">F1</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-macro w-100" onclick="sendScaleCommand('kf2')">F2</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-macro w-100" onclick="sendScaleCommand('kf3')">F3</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-macro w-100" onclick="sendScaleCommand('kf4')">F4</button>
                        </div>
                    </div>

                    <!-- لوحة المفاتيح الرقمية -->
                    <div class="row g-2">
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k1')">1</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k2')">2</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k3')">3</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-print w-100" onclick="sendScaleCommand('kenter')">
                                <i class="fas fa-check"></i><br>ENTER
                            </button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k4')">4</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k5')">5</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k6')">6</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k0')">0</button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k7')">7</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k8')">8</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('k9')">9</button>
                        </div>
                        <div class="col-3">
                            <button class="btn control-btn btn-number w-100" onclick="sendScaleCommand('kspace')">
                                <i class="fas fa-space-shuttle"></i><br>SPACE
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- القسم الأيسر - الروابط والحالة -->
            <div class="col-lg-4 col-md-12">
                <!-- روابط التنقل -->
                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-link"></i>
                        التنقل السريع
                    </div>
                    <div class="text-center">
                        <a href="table1.html" class="nav-link-custom">
                            <i class="fas fa-table"></i>
                            جدول البيانات
                        </a>
                        <a href="ticket_table" class="nav-link-custom">
                            <i class="fas fa-ticket-alt"></i>
                            جدول التذاكر
                        </a>
                        <a href="cam.html" class="nav-link-custom">
                            <i class="fas fa-camera"></i>
                            كاميرا
                        </a>
                        <a href="iq710-scale.html" class="nav-link-custom">
                            <i class="fas fa-microchip"></i>
                            مستقل
                        </a>
                        <a href="#" class="nav-link-custom">
                            <i class="fas fa-users"></i>
                            إدارة العملاء
                        </a>
                    </div>
                </div>

                <!-- حالة البث المباشر -->
                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-video"></i>
                        البث المباشر
                    </div>
                    <div class="loading-status">
                        <i class="fas fa-spinner"></i>
                        جاري تحميل البث...
                    </div>
                </div>

                <!-- حالة الطباعة -->
                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-print"></i>
                        الطباعة الحرارية
                    </div>
                    <div class="loading-status">
                        <i class="fas fa-spinner"></i>
                        جاري التحميل...
                    </div>
                </div>

                <!-- حالة الصوت -->
                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-volume-up"></i>
                        الصوت
                    </div>
                    <div class="loading-status">
                        <i class="fas fa-spinner"></i>
                        جاري التحميل...
                    </div>
                </div>

                <!-- سجل الأوامر -->
                <div class="section-card">
                    <div class="section-title">
                        <i class="fas fa-terminal"></i>
                        سجل الأوامر EDP
                    </div>
                    <div class="command-log" id="EDP">
                        في انتظار التذكرة...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <script>
        // Socket.IO connection
        const socket = io();
        
        // إرسال أمر للميزان
        function sendScaleCommand(command) {
            console.log('إرسال أمر:', command);
            fetch(`/send-command?command=${command}`)
                .then(() => {
                    playClickSound();
                })
                .catch(error => console.error("Error sending command:", error));
        }
        
        // تشغيل صوت نقر
        function playClickSound() {
            const audio = new Audio('/audio/click.wav');
            audio.play().catch(e => console.log('Sound play failed:', e));
        }
        
        // استقبال البيانات من Socket.IO
        socket.on('response', (data) => {
            console.log('البيانات المستلمة:', data);
            
            if (data && data.toUpperCase() === "OK") {
                sendCommand('p');
                playClickSound();
            }
            if (data && data.toUpperCase() === "??") {
                sendCommand('p');
                playClickSound();
            }
            if (data && data.length >= 11 && data.length <= 12) {
                let cleanData = data
                    .replace(/\x02/g, '')
                    .trim();
                document.getElementById('response').innerHTML = cleanData;
            } else {
                const box = document.getElementById('EDP');
                if (box) {
                    box.innerHTML += `${data}\n`;
                    box.scrollTop = box.scrollHeight;
                }
                if (data && data.slice(-2).toUpperCase() === "NE") {
                    document.getElementById('response11').innerHTML = `<span class="badge bg-primary">${data}</span>`;
                }
            }
        });
        
        // دالة مساعدة لإرسال الأوامر
        function sendCommand(command) {
            fetch(`/send-command?command=${command}`)
                .catch(error => console.error("Error sending command:", error));
        }
        
        // التحكم في الميزان من لوحة المفاتيح
        document.addEventListener('keydown', function (event) {
            // عدم تنفيذ الأوامر أثناء الكتابة داخل حقول الإدخال
            const target = event.target;
            if (
                target.matches('input, textarea, select') ||
                target.isContentEditable
            ) {
                return;
            }
            
            // منع تكرار الأمر عند استمرار الضغط على المفتاح
            if (event.repeat) {
                return;
            }
            
            // الأرقام من 0 إلى 9
            if (/^[0-9]$/.test(event.key)) {
                event.preventDefault();
                sendScaleCommand('k' + event.key);
                return;
            }
            
            // أمر المسح
            if (event.key === 'Delete' || event.key === 'Backspace') {
                event.preventDefault();
                sendScaleCommand('kclr');
                return;
            }
            
            // زر Enter للطباعة
            if (event.key === 'Enter') {
                event.preventDefault();
                sendScaleCommand('kprint');
                return;
            }
            
            if (event.key === '+') {
                event.preventDefault();
                sendScaleCommand('kid');
            }
            if (event.key === '-') {
                event.preventDefault();
                sendScaleCommand('ktare');
            }
        });
    </script>
</body>
</html>
