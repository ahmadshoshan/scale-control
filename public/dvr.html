<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف صور الميزان (DVR)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .dvr-header { background-color: #2c3e50; padding: 15px; border-bottom: 2px solid #34495e; margin-bottom: 20px; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; padding: 10px; }
        .image-card { background-color: #2c3e50; border-radius: 8px; overflow: hidden; border: 1px solid #34495e; transition: transform 0.2s; }
        .image-card:hover { transform: scale(1.02); border-color: #3498db; }
        .image-card img { width: 100%; height: 180px; object-fit: cover; cursor: pointer; }
        .image-info { padding: 10px; font-size: 0.85rem; color: #bdc3c7; text-align: center; }
        .btn-dvr { background-color: #e74c3c; color: white; border: none; }
        .btn-dvr:hover { background-color: #c0392b; color: white; }
        .btn-dvr-secondary { background-color: #f39c12; color: white; border: none; }
        .btn-dvr-secondary:hover { background-color: #d35400; color: white; }
        /* Modal for full image */
        .modal-content { background-color: #2c3e50; color: white; }
    </style>
</head>
<body>

<div class="dvr-header d-flex justify-content-between align-items-center">
    <h4 class="m-0">📹 أرشيف صور الميزان</h4>
    <div>
        <a href="/" class="btn btn-outline-light btn-sm">العودة للرئيسية</a>
    </div>
</div>

<div class="container-fluid">
    <!-- شريط التحكم -->
    <div class="row mb-4 p-3 bg-dark rounded">
        <div class="col-md-4">
            <label class="form-label">اختر التاريخ:</label>
            <select id="dateSelect" class="form-select bg-secondary text-white border-0">
                <option value="">جاري التحميل...</option>
            </select>
        </div>
        <div class="col-md-8 d-flex align-items-end justify-content-end gap-2">
            <button onclick="deleteToday()" class="btn btn-dvr-secondary">🗑️ مسح صور اليوم</button>
            <button onclick="deleteAll()" class="btn btn-dvr">⚠️ مسح جميع الصور</button>
        </div>
    </div>

    <!-- شبكة عرض الصور -->
    <div id="imageGrid" class="image-grid">
        <div class="text-center w-100 mt-5 text-muted">اختر تاريخاً لعرض الصور</div>
    </div>
</div>

<!-- Modal لعرض الصورة بحجم كامل -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="modalImageTitle"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center p-0">
                <img id="fullImage" src="" class="img-fluid" style="max-height: 80vh;">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const dateSelect = document.getElementById('dateSelect');
    const imageGrid = document.getElementById('imageGrid');
    const imageModal = new bootstrap.Modal(document.getElementById('imageModal'));

    // 1. تحميل قائمة التواريخ عند فتح الصفحة
    async function loadDates() {
        try {
            const res = await fetch('/api/dvr/dates');
            const data = await res.json();
            
            dateSelect.innerHTML = '<option value="">-- اختر التاريخ --</option>';
            if (data.dates.length === 0) {
                dateSelect.innerHTML += '<option value="" disabled>لا توجد صور مسجلة</option>';
                return;
            }
            
            data.dates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = date;
                dateSelect.appendChild(option);
            });

            // تحديد اليوم افتراضياً إذا كان موجوداً
            const today = new Date().toISOString().split('T')[0];
            if (data.dates.includes(today)) {
                dateSelect.value = today;
                loadImages(today);
            }
        } catch (err) {
            console.error('فشل في جلب التواريخ:', err);
        }
    }

    // 2. تحميل الصور لتاريخ محدد
    async function loadImages(date) {
        if (!date) {
            imageGrid.innerHTML = '<div class="text-center w-100 mt-5 text-muted">اختر تاريخاً لعرض الصور</div>';
            return;
        }

        imageGrid.innerHTML = '<div class="text-center w-100 mt-5"><div class="spinner-border text-primary" role="status"></div></div>';

        try {
            const res = await fetch(`/api/dvr/images/${date}`);
            const data = await res.json();

            if (data.images.length === 0) {
                imageGrid.innerHTML = '<div class="text-center w-100 mt-5 text-muted">لا توجد صور لهذا التاريخ</div>';
                return;
            }

            imageGrid.innerHTML = '';
            data.images.forEach(img => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <img src="${img.url}" onclick="showFullImage('${img.url}', '${img.info}')" loading="lazy">
                    <div class="image-info">${img.info}</div>
                `;
                imageGrid.appendChild(card);
            });
        } catch (err) {
            imageGrid.innerHTML = '<div class="text-center w-100 mt-5 text-danger">حدث خطأ في جلب الصور</div>';
        }
    }

    // 3. عرض الصورة بحجم كامل
    function showFullImage(url, info) {
        document.getElementById('fullImage').src = url;
        document.getElementById('modalImageTitle').textContent = info;
        imageModal.show();
    }

    // 4. حذف صور اليوم
    async function deleteToday() {
        const today = new Date().toISOString().split('T')[0];
        if (!confirm(`هل أنت متأكد من حذف جميع صور يوم ${today}؟ لا يمكن التراجع عن هذا الإجراء.`)) return;

        try {
            const res = await fetch(`/api/dvr/images/${today}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                alert(data.message);
                loadDates(); // إعادة تحميل القائمة
            } else {
                alert('فشل في الحذف: ' + data.message);
            }
        } catch (err) {
            alert('حدث خطأ في الاتصال');
        }
    }

    // 5. حذف جميع الصور
    async function deleteAll() {
        if (!confirm('⚠️ تحذير: هل أنت متأكد من حذف جميع الصور المحفوظة نهائياً؟')) return;
        if (!confirm('تأكيد نهائي: سيتم حذف كل شيء!')) return;

        try {
            const res = await fetch('/api/dvr/images', { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                alert(data.message);
                loadDates();
            } else {
                alert('فشل في الحذف: ' + data.message);
            }
        } catch (err) {
            alert('حدث خطأ في الاتصال');
        }
    }

    // مستمع لتغيير التاريخ
    dateSelect.addEventListener('change', (e) => loadImages(e.target.value));

    // بدء التشغيل
    loadDates();
</script>
</body>
</html>
