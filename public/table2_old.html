    });

  <script>
    const typeInput = document.getElementById("editType");
    const priceInput = document.getElementById("editPrice");
    const netInput = document.getElementById("editNet");

    const typesList = document.getElementById("types");

    function getUnitWeight(typeName) {
      const option = Array.from(typesList.options)
        .find(o => o.value === typeName);
      return option ? parseFloat(option.dataset.unit) : 0;
    }

    function calculateTotal() {

      const net = parseFloat(netInput.value);
      const price = parseFloat(priceInput.value);
      const unitWeight = getUnitWeight(typeInput.value);



      document.getElementById("editType").addEventListener("input", function () {
        const value = this.value.trim();
        let unitWeight = 0;

        // لو المستخدم كتب رقم → وزن يدوي
        if (!isNaN(value) && value !== "") {
          unitWeight = parseFloat(Number(value));
        }

        const total = (net * price) / unitWeight;



      });


      if (!net || !price || !unitWeight) {

        return;
      }

      const total = (net * price) / unitWeight;



      ///////////////////////////////////////////////////////////////////
      if (!net || !price || !unitWeight) {
        document.getElementById("totalTableBody").innerHTML =
          `<tr><td colspan="6" class="text-muted">لا توجد بيانات</td></tr>`;
        return;
      }

      const units = Math.floor(net / unitWeight);
      const remain = net % unitWeight;

      document.getElementById("totalTableBody").innerHTML = `
    <tr>
     
      <td>${price}</td>
      <td>${unitWeight}</td>
      <td>${units}</td>
      <td>${remain}</td>
      <td class="fw-bold text-success">${total.toFixed(2)} جنيه</td>
    </tr>
  `;
    }


    typeInput.addEventListener("input", calculateTotal);
    priceInput.addEventListener("input", calculateTotal);
    netInput.addEventListener("input", calculateTotal);

  </script>

            `  تم اضافه سياره قم ${row.NE} (وزن: ${row.gross})`;
          // 🖼️ صورة من الكاميرا الأولى
          document.getElementById("toastImg1").src =
            `images/sensor/${row.images}_cam1.jpg`;
          document.getElementById("toastImg2").src =
            `images/sensor/${row.images}_cam2.jpg`;
          document.getElementById("toastImg3").src =
            `images/sensor/${row.images}_cam3.jpg`;


          const toastEl = document.getElementById('liveToast');
          const toast = new bootstrap.Toast(toastEl, {
            delay: 10000 // 10 ثواني
          });

          toast.show();
        }, 500);
      }

    }

  </script>
  <div class="toast-container position-fixed top-0 end-0 p-3">

      <div class="toast-header">

        <strong class="me-auto">📢 إشعار</strong>

        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div style="display:flex; justify-content:center; gap:4px;">
        <img id="toastImg1" src="" class="rounded me-2" style="width:80px;height:80px;object-fit:cover;">
        <img id="toastImg2" src="" class="rounded me-2" style="width:80px;height:80px;object-fit:cover;">
        <img id="toastImg3" src="" class="rounded me-2" style="width:80px;height:80px;object-fit:cover;">
      </div>

      <h4 class="toast-body" id="toastBody"></h4>

    </div>
