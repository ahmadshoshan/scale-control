  <script>
    function takeScreenshot() {
      // نخفي الزر مؤقتاً من الصورة
      const btn = event.target;
      btn.style.display = 'none';

      html2canvas(document.body, { scale: 2 }).then(canvas => {
        // نعيد إظهار الزر بعد الالتقاط
        btn.style.display = 'inline-block';

        // إنشاء رابط لتحميل الصورة
        const link = document.createElement('a');
        link.download = 'screenshot.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>

      document.getElementById("status").innerText =

          <script>
            let isStreaming = false; // متغير لتحديد ما إذا كان الإرسال نشطًا أم لا
            let streamInterval; // متغير لتخزين معرف المؤقت
            let stopTimeout; // متغير لتخزين معرف المؤقت الخاص بالتوقف التلقائي

            function toggleStream() {
              const button = document.getElementById("streamButton");

              if (!isStreaming) {
                // بدء الإرسال المستمر للأمر ZZ
                isStreaming = true;
                button.textContent = "Stop Stream P"; // تغيير نص الزر إلى "Stop Stream"

                // إرسال الأمر ZZ كل 1000 ميلي ثانية (1 ثانية)
                streamInterval = setInterval(() => {
                  sendCommand("p");//zz or p
                }, 1000);
                // إيقاف الإرسال تلقائيًا بعد دقيقة واحدة (60000 ميلي ثانية)
                stopTimeout = setTimeout(() => {
                  stopStreaming(); // إيقاف الإرسال بعد انتهاء الوقت
                }, 20000); // 60000 ميلي ثانية = دقيقة واحدة
              } else {
                // إيقاف الإرسال المستمر للأمر ZZ
                isStreaming = false;
                button.textContent = "Start Stream"; // تغيير نص الزر إلى "Start Stream"

                // إيقاف المؤقت
                clearInterval(streamInterval);
              }
            }
            function stopStreaming() {
              const button = document.getElementById("streamButton");

              if (isStreaming) {
                isStreaming = false;
                button.textContent = "Start Stream"; // تغيير نص الزر إلى "Start Stream"

                // إيقاف المؤقت الدوري
                clearInterval(streamInterval);

                // مسح مؤقت التوقف التلقائي إذا كان موجودًا
                clearTimeout(stopTimeout);
              }
            }
