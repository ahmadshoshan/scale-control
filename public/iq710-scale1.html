<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>نظام وزن السيارات - ميزان شوشان</title>
  
  
     <link href="css/bootstrap.min.css" rel="stylesheet">
 <link href="css/all.min.css" rel="stylesheet">
  <style>
    * {
      font-family: 'Tajawal', sans-serif;
    }

    :root {
      --primary-color: #4361ee;
      --success-color: #06d6a0;
      --danger-color: #ef476f;
      --warning-color: #ffd166;
      --dark-color: #2b2d42;
      --light-color: #f8f9fa;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 8px;
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* بطاقة الوزن الرئيسية */
    .weight-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      text-align: center;
    }

    .weight-display {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-color), #7209b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      cursor: pointer;
    }

    .weight-unit {
      font-size: 1.5rem;
      color: #666;
    }

    /* نافذة إدخال الوزن يدوي */
    .manual-weight-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 10001;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .manual-weight-modal.show {
      display: flex;
    }

    .manual-weight-content {
      background: white;
      border-radius: 20px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .weight-input {
      font-size: 2rem;
      text-align: center;
      padding: 15px;
      margin: 15px 0;
      border: 2px solid var(--primary-color);
      border-radius: 15px;
      font-weight: bold;
    }

    /* بطاقات السيارات - تصغير الحجم */
    .truck-card {
      background: white;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: all 0.3s;
      border-right: 4px solid var(--primary-color);
    }

    .truck-card.first-weight {
      border-right-color: var(--warning-color);
      background: linear-gradient(to left, #fff, #fff9e6);
    }

    .truck-card.completed {
      border-right-color: var(--success-color);
      background: linear-gradient(to left, #fff, #f0fff4);
    }

    .truck-number {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--dark-color);
    }

    /* بطاقة الوزن المنفصلة - تصغير للموبايل */
    .weight-box {
      background: #f8f9fa;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #e0e0e0;
      height: 100%;
      transition: all 0.3s;
      padding: 5px;
    }

    .weight-label {
      font-size: 0.7rem;
      color: #666;
      margin-bottom: 2px;
    }

    .weight-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--dark-color);
      margin: 2px 0;
    }

    .weight-value.net {
      color: var(--success-color);
      font-size: 1.2rem;
    }

    .datetime {
      font-size: 0.6rem;
      color: #888;
      margin-top: 2px;
      padding-top: 2px;
      border-top: 1px dashed #ddd;
    }

    /* الصور للموبايل */
    .image-box {
      text-align: center;
      background: transparent;
      border-radius: 8px;
    }

    .image-box img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .image-box img:hover {
      transform: scale(1.05);
      border-color: var(--primary-color);
    }

    .image-placeholder {
      width: 50px;
      height: 50px;
      background: #e0e0e0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 1rem;
      margin: 0 auto;
    }

    /* أزرار الإجراءات */
    .action-buttons {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .action-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: all 0.3s;
      cursor: pointer;
    }

    /* لوحة المفاتيح الرقمية */
    .keyboard-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 8px;
      margin-top: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 999;
    }

    .keyboard-container.show {
      display: block;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .keyboard-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      justify-content: center;
    }

    .key-btn {
      flex: 1;
      padding: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 60px;
    }

    .key-btn:active {
      transform: scale(0.95);
    }

    .key-btn.special {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .key-btn.enter {
      background: linear-gradient(135deg, #06d6a0, #0cb8b8);
      flex: 2;
    }

    .key-btn.clear {
      background: linear-gradient(135deg, #ef476f, #b5179e);
    }

    .toggle-keyboard {
      position: fixed;
      bottom: 10px;
      left: 10px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color), #7209b7);
      color: white;
      border: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 1000;
      font-size: 1rem;
    }

    /* حقل الإدخال */
    .input-group-custom {
      background: white;
      border-radius: 50px;
      padding: 3px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .input-group-custom input {
      border: none;
      padding: 8px 15px;
      font-size: 0.9rem;
      border-radius: 0 50px 50px 0;
      text-align: center;
      font-weight: bold;
    }

    .input-group-custom button {
      border-radius: 50px 0 0 50px;
      padding: 8px 15px;
      font-size: 0.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), #7209b7);
      color: white;
      border: none;
    }

    /* التبويبات */
    .tab-buttons {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 8px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(5px);
      transition: all 0.3s;
    }

    /* إشعار toast */
    .toast-notification {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 10px 20px;
      border-radius: 40px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      display: none;
      z-index: 9999;
      font-weight: 600;
      font-size: 0.9rem;
      max-width: 90%;
      text-align: center;
    }

    /* تنسيق إضافي لعرض الصورة على اليمين */
    .weight-box .d-flex {
      direction: rtl;
      gap: 5px;
    }

    .weight-box .image-box {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .weight-box .flex-grow-1 {
      text-align: right;
    }

    .weight-value small {
      font-size: 0.6rem;
      font-weight: normal;
      color: #888;
    }

    /* تحسينات للموبايل */
    @media (max-width: 768px) {
      .row {
        margin: 0;
      }
      .col-4 {
        padding: 0 3px;
      }
      .truck-number { 
        font-size: 0.9rem; 
      }
      .weight-value { 
        font-size: 0.85rem; 
      }
      .weight-value.net { 
        font-size: 1rem; 
      }
      .action-btn { 
        width: 28px; 
        height: 28px; 
        font-size: 0.7rem; 
      }
      .image-box img, .image-placeholder { 
        width: 40px; 
        height: 40px; 
      }
      .key-btn { 
        padding: 8px; 
        font-size: 1rem; 
        min-width: 45px; 
      }
      .badge {
        font-size: 0.6rem !important;
      }
    }
  </style>
</head>
<body>

  <!-- شاشة التحميل -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
  </div>

  <!-- إشعار toast -->
  <div class="toast-notification" id="toastMessage"></div>

  <!-- نافذة إدخال الوزن يدوي -->
  <div id="manualWeightModal" class="manual-weight-modal">
    <div class="manual-weight-content">
      <h5><i class="fas fa-weight-scale"></i> إدخال الوزن يدوياً</h5>
      <input type="number" id="manualWeightInput" class="weight-input" placeholder="أدخل الوزن بالكيلوجرام" step="1">
      <div class="d-flex gap-2">
        <button class="btn btn-success flex-grow-1" onclick="confirmManualWeight()">
          <i class="fas fa-check"></i> تأكيد
        </button>
        <button class="btn btn-danger flex-grow-1" onclick="closeManualWeightModal()">
          <i class="fas fa-times"></i> إلغاء
        </button>
      </div>
    </div>
  </div>

  <!-- معرض الصور المنبثق -->
  <div id="imgModal" class="img-modal" onclick="closeModal(event)">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <img id="modalImg" class="modal-img">
      <div id="modalCaption" class="modal-caption"></div>
    </div>
  </div>

  <!-- زر إظهار/إخفاء لوحة المفاتيح -->
  <button class="toggle-keyboard" onclick="toggleKeyboard()">
    <i class="fas fa-keyboard"></i>
  </button>

  <div class="main-container">
    
    <!-- عنوان الصفحة -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h1 class="text-white" style="font-size: 1.2rem;">
        <i class="fas fa-truck me-2"></i>
        نظام وزن السيارات
      </h1>
      <div>
        <a href="index.html" class="btn btn-light btn-sm">
          <i class="fas fa-arrow-right"></i>
          لوحة التحكم
        </a>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap;">
      <!-- بطاقة الوزن المباشر -->
      <div class="weight-card" style="flex: 1; min-width: 180px;">
        <div class="weight-display" id="currentWeight" onclick="openManualWeightModal()" title="انقر لإدخال الوزن يدوياً">
          -- <span class="weight-unit">كجم</span>
        </div>
        <small class="text-muted">انقر على الوزن لإدخاله يدوياً</small>
      </div>

      <!-- إضافة سيارة جديدة -->
      <div class="weight-card" style="flex: 1; min-width: 200px;">
        <div class="input-group-custom d-flex">
          <button onclick="addFirstWeight()">
            <i class="fas fa-weight-scale"></i>
            وزن أول
          </button>
          <input type="text" id="newTruckNumber" class="form-control" placeholder="رقم السيارة" 
                 onkeypress="handleEnterPress(event)" autofocus>
        </div>
        <small class="text-muted">اضغط Enter للإضافة</small>
      </div>
    </div>

    <!-- حقول إضافية للعميل والنوع -->
    <div class="row g-2 mb-3">
      <div class="col-6">
        <div class="weight-card" style="padding: 5px;">
          <input list="customers" id="globalCustomer" class="form-control form-control-sm" placeholder="العميل">
          <datalist id="customers">
            <option value="الحاج خالد عبد السلام">
            <option value="عماد نوح">
            <option value="محمد الصندفاوي">
            <option value="محمد منصور">
            <option value="محمود نصير">
          </datalist>
        </div>
      </div>
      <div class="col-6">
        <div class="weight-card" style="padding: 5px;">
          <input list="types" id="globalType" class="form-control form-control-sm" placeholder="النوع">
          <datalist id="types">
            <option value="أرز">
            <option value="غلة">
            <option value="تبن">
            <option value="خشب">
            <option value="فول">
          </datalist>
        </div>
      </div>
    </div>

    <!-- لوحة المفاتيح الرقمية -->
    <div class="keyboard-container" id="keyboardContainer">
      <div class="keyboard-row">
        <button class="key-btn" onclick="addToInput('1')">1</button>
        <button class="key-btn" onclick="addToInput('2')">2</button>
        <button class="key-btn" onclick="addToInput('3')">3</button>
      </div>
      <div class="keyboard-row">
        <button class="key-btn" onclick="addToInput('4')">4</button>
        <button class="key-btn" onclick="addToInput('5')">5</button>
        <button class="key-btn" onclick="addToInput('6')">6</button>
      </div>
      <div class="keyboard-row">
        <button class="key-btn" onclick="addToInput('7')">7</button>
        <button class="key-btn" onclick="addToInput('8')">8</button>
        <button class="key-btn" onclick="addToInput('9')">9</button>
      </div>
      <div class="keyboard-row">
        <button class="key-btn special" onclick="addToInput('0')">0</button>
        <button class="key-btn clear" onclick="clearInput()">
          <i class="fas fa-backspace"></i> مسح
        </button>
        <button class="key-btn enter" onclick="addFirstWeight()">
          <i class="fas fa-check"></i> Enter
        </button>
      </div>
    </div>

    <!-- تبويبات عرض السيارات -->
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">
        <i class="fas fa-list"></i> الكل
      </button>
      <button class="tab-btn" id="tabFirst" onclick="switchTab('first')">
        <i class="fas fa-clock"></i> وزن أول
      </button>
      <button class="tab-btn" id="tabCompleted" onclick="switchTab('completed')">
        <i class="fas fa-check-circle"></i> مكتملة
      </button>
    </div>

    <!-- قائمة السيارات -->
    <div id="trucksList">
      <!-- السيارات ستضاف هنا ديناميكياً -->
    </div>

    <!-- زر تحميل المزيد -->
    <button class="btn btn-light w-100 py-1 mt-2" onclick="loadMore()" id="loadMoreBtn" style="display: none; font-size: 0.8rem;">
      <i class="fas fa-arrow-down"></i>
      تحميل المزيد
    </button>

  </div>

  <!-- السكربتات -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  
  <script>
    // تهيئة Socket.IO
    const socket = io();
    let currentWeight = 0;
    let trucks = [];
    let currentTab = 'all';
    let displayLimit = 10;
    let allTrucks = [];
    let pendingWeightCallback = null;

    // تحميل السيارات المحفوظة عند بدء التشغيل
    window.onload = function() {
      loadSavedTrucks();
      setupSocketListeners();
      focusInput();
    };

    // فتح نافذة إدخال الوزن يدوي
    function openManualWeightModal(callback) {
      pendingWeightCallback = callback;
      const modal = document.getElementById('manualWeightModal');
      const input = document.getElementById('manualWeightInput');
      input.value = currentWeight > 0 ? currentWeight : '';
      modal.classList.add('show');
      input.focus();
    }

    // إغلاق نافذة إدخال الوزن يدوي
    function closeManualWeightModal() {
      const modal = document.getElementById('manualWeightModal');
      modal.classList.remove('show');
      pendingWeightCallback = null;
    }

    // تأكيد إدخال الوزن يدوي
    function confirmManualWeight() {
      const input = document.getElementById('manualWeightInput');
      const weight = parseFloat(input.value);
      
      if (isNaN(weight) || weight <= 0) {
        showToast('الرجاء إدخال وزن صحيح', 'error');
        return;
      }
      
      currentWeight = weight;
      const weightDisplay = document.getElementById('currentWeight');
      weightDisplay.innerHTML = `${weight.toLocaleString()} <span class="weight-unit">كجم</span>`;
      
      showToast(`تم إدخال الوزن: ${weight} كجم`, 'success');
      closeManualWeightModal();
      
      // تنفيذ callback إذا كان موجود
      if (pendingWeightCallback) {
        pendingWeightCallback(weight);
        pendingWeightCallback = null;
      }
    }

    // تركيز على حقل الإدخال
    function focusInput() {
      document.getElementById('newTruckNumber').focus();
    }

    // تبديل لوحة المفاتيح
    function toggleKeyboard() {
      const keyboard = document.getElementById('keyboardContainer');
      keyboard.classList.toggle('show');
      if (keyboard.classList.contains('show')) {
        document.getElementById('newTruckNumber').focus();
      }
    }

    // إضافة رقم إلى حقل الإدخال
    function addToInput(number) {
      const input = document.getElementById('newTruckNumber');
      input.value += number;
      input.focus();
    }

    // مسح حقل الإدخال
    function clearInput() {
      const input = document.getElementById('newTruckNumber');
      input.value = '';
      input.focus();
    }

    // إعداد مستمعي Socket.IO
    function setupSocketListeners() {
      // استقبال الوزن من الميزان
      socket.on('response', (data) => {
        if (data && data.length >= 11 && data.length <= 12) {
          const weightDisplay = document.getElementById('currentWeight');
          if (weightDisplay) {
            const cleanWeight = data.replace(/[^0-9.-]/g, '');
            const weight = parseFloat(cleanWeight);
            if (!isNaN(weight) && weight > 0) {
              currentWeight = weight;
              weightDisplay.innerHTML = `${weight.toLocaleString()} <span class="weight-unit">كجم</span>`;
            }
          }
        }
      });

      // استقبال تذاكر جديدة من السيرفر
      socket.on('printer:new', (row) => {
        if (row.number && !allTrucks.find(t => t.number === row.number && !t.secondWeight)) {
          const newTruck = {
            id: Date.now().toString(),
            number: row.number,
            firstWeight: parseFloat(row.gross) || 0,
            firstTime: row.time,
            firstDate: row.date,
            firstImage: row.images ? `images/print/${row.images}_cam1.jpg` : null,
            secondWeight: parseFloat(row.tare) || null,
            secondTime: row.time,
            secondDate: row.date,
            secondImage: row.images ? `images/print/${row.images}_cam2.jpg` : null,
            netWeight: parseFloat(row.net) || null,
            netCalculated: true,
            images: row.images,
            customer: row.customer || '',
            type: row.type || ''
          };
          allTrucks.unshift(newTruck);
          saveTrucks();
          filterAndDisplayTrucks();
          showToast(`تم استقبال سيارة جديدة: ${row.number}`, 'success');
        }
      });

      // استقبال بيانات الحساسات
      socket.on('id:new', (row) => {
        if (row.NE && !allTrucks.find(t => t.number === row.NE && !t.secondWeight)) {
          const newTruck = {
            id: Date.now().toString(),
            number: row.NE,
            firstWeight: parseFloat(row.gross) || 0,
            firstTime: new Date().toLocaleTimeString('ar-EG'),
            firstDate: new Date().toLocaleDateString('ar-EG'),
            firstImage: row.images ? `images/sensor/${row.images}_cam1.jpg` : null,
            secondWeight: null,
            secondTime: null,
            secondDate: null,
            secondImage: null,
            netWeight: null,
            netCalculated: false,
            images: row.images,
            customer: '',
            type: ''
          };
          allTrucks.unshift(newTruck);
          saveTrucks();
          filterAndDisplayTrucks();
          showToast(`تم استقبال سيارة: ${row.NE}`, 'success');
        }
      });
    }

    // تحميل السيارات المحفوظة من localStorage
    function loadSavedTrucks() {
      const saved = localStorage.getItem('weighingTrucks');
      if (saved) {
        allTrucks = JSON.parse(saved);
        filterAndDisplayTrucks();
      }
    }

    // حفظ السيارات في localStorage
    function saveTrucks() {
      localStorage.setItem('weighingTrucks', JSON.stringify(allTrucks));
    }

    // تصفية وعرض السيارات حسب التبويب المحدد
    function filterAndDisplayTrucks() {
      let filtered = [];
      switch(currentTab) {
        case 'first':
          filtered = allTrucks.filter(t => t.firstWeight && !t.secondWeight);
          break;
        case 'completed':
          filtered = allTrucks.filter(t => t.netCalculated);
          break;
        default:
          filtered = [...allTrucks];
      }
      
      trucks = filtered.slice(0, displayLimit);
      displayTrucks();
      
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      if (filtered.length <= displayLimit) {
        loadMoreBtn.style.display = 'none';
      } else {
        loadMoreBtn.style.display = 'block';
      }
    }

    // عرض السيارات في الصفحة
    function displayTrucks() {
      const listElement = document.getElementById('trucksList');
      listElement.innerHTML = '';
      
      if (trucks.length === 0) {
        listElement.innerHTML = `
          <div class="text-center text-white py-3">
            <i class="fas fa-truck fa-2x mb-2"></i>
            <h6>لا توجد سيارات</h6>
            <p class="small">أضف سيارة جديدة</p>
          </div>
        `;
        return;
      }

      trucks.forEach(truck => {
        listElement.appendChild(createTruckCard(truck));
      });
    }

    // إنشاء بطاقة سيارة مع الصورة على اليمين
    function createTruckCard(truck) {
      const card = document.createElement('div');
      card.className = `truck-card ${!truck.secondWeight ? 'first-weight' : truck.netCalculated ? 'completed' : 'second-weight'}`;
      card.id = `truck-${truck.id}`;

      const firstWeight = truck.firstWeight ? truck.firstWeight.toLocaleString() : '---';
      const secondWeight = truck.secondWeight ? truck.secondWeight.toLocaleString() : '---';
      const netWeight = truck.netWeight ? truck.netWeight.toLocaleString() : '---';
      const firstDateTime = truck.firstTime ? `<div class="datetime"><i class="far fa-clock"></i> ${truck.firstTime}</div>` : '';
      const secondDateTime = truck.secondTime ? `<div class="datetime"><i class="far fa-clock"></i> ${truck.secondTime}</div>` : '';

      card.innerHTML = `
        <div class="row align-items-center">
          <div class="col-12 mb-1">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <span class="truck-number">🚛 ${truck.number}</span>
                ${truck.customer ? `<span class="badge bg-info ms-1">${truck.customer}</span>` : ''}
                ${truck.type ? `<span class="badge bg-success">${truck.type}</span>` : ''}
              </div>
            </div>
          </div>

          <div class="col-4">
            <div class="weight-box first">
              <div class="d-flex align-items-center gap-1">
                <div class="image-box" style="flex-shrink: 0;">
                  ${truck.firstImage ? 
                    `<img src="${truck.firstImage}" onclick="openImage('${truck.firstImage}', 'الوزن الأول - ${truck.number}')">` : 
                    `<div class="image-placeholder"><i class="fas fa-camera"></i></div>`
                  }
                </div>
                <div class="flex-grow-1 text-end">
                  <div class="weight-label"><i class="fas fa-arrow-up text-warning"></i> الوزن الأول</div>
                  <div class="weight-value">${firstWeight} <small>كجم</small></div>
                  ${firstDateTime}
                </div>
              </div>
            </div>
          </div>

          <div class="col-4">
            <div class="weight-box second">
              <div class="d-flex align-items-center gap-1">
                <div class="image-box" style="flex-shrink: 0;">
                  ${truck.secondImage ? 
                    `<img src="${truck.secondImage}" onclick="openImage('${truck.secondImage}', 'الوزن الثاني - ${truck.number}')">` : 
                    `<div class="image-placeholder"><i class="fas fa-camera"></i></div>`
                  }
                </div>
                <div class="flex-grow-1 text-end">
                  <div class="weight-label"><i class="fas fa-arrow-down text-success"></i> الوزن الثاني</div>
                  <div class="weight-value">${secondWeight} <small>كجم</small></div>
                  ${secondDateTime}
                </div>
              </div>
            </div>
          </div>

          <div class="col-4">
            <div class="weight-box net">
              <div class="text-center">
                <div class="weight-label"><i class="fas fa-balance-scale"></i> الصافي</div>
                <div class="weight-value net">${netWeight} <small>كجم</small></div>
                <div class="action-buttons">
                  ${!truck.secondWeight ? 
                    `<button class="action-btn btn-weight" onclick="checkWeightAndCapture('${truck.id}')" title="وزن ثاني">
                      <i class="fas fa-weight-scale"></i>
                    </button>` : ''
                  }
                  ${truck.netWeight ? 
                    `<button class="action-btn btn-print" onclick="printTicket('${truck.id}')" title="طباعة">
                      <i class="fas fa-print"></i>
                    </button>` : ''
                  }
                  <button class="action-btn btn-clear" onclick="clearTruck('${truck.id}')" title="حذف">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      return card;
    }

    // التحقق من الوزن قبل التقاط الوزن الثاني
    function checkWeightAndCapture(id) {
      if (currentWeight === 0) {
        // عرض رسالة وإعطاء خيار إدخال الوزن يدوي
        showToast('لا يوجد وزن على الميزان. الرجاء إدخال الوزن يدوياً', 'warning');
        openManualWeightModal(function(weight) {
          if (weight > 0) {
            captureSecondWeightWithValue(id, weight);
          }
        });
      } else {
        captureSecondWeight(id);
      }
    }

    // إضافة وزن أول مع التحقق
    async function addFirstWeight() {
      const number = document.getElementById('newTruckNumber').value.trim();
      const customer = document.getElementById('globalCustomer').value;
      const type = document.getElementById('globalType').value;

      if (!number) {
        showToast('الرجاء إدخال رقم السيارة', 'error');
        return;
      }

      if (currentWeight === 0) {
        showToast('لا يوجد وزن على الميزان. الرجاء إدخال الوزن يدوياً', 'warning');
        openManualWeightModal(async function(weight) {
          if (weight > 0) {
            await addFirstWeightWithValue(number, customer, type, weight);
          }
        });
        return;
      }

      await addFirstWeightWithValue(number, customer, type, currentWeight);
    }

    // إضافة وزن أول بقيمة محددة
    async function addFirstWeightWithValue(number, customer, type, weight) {
      const existing = allTrucks.find(t => t.number === number && !t.secondWeight);
      if (existing) {
        showToast('هذه السيارة موجودة بالفعل في قائمة الوزن الأول', 'warning');
        return;
      }

      showLoading(true);
      
      try {
        const imageId = `${Date.now()}_${number}_${weight}`;
        
        try {
          await fetch(`/capture-images/${imageId}/first`);
        } catch (e) {
          console.log('فشل التقاط الصور:', e);
        }

        const now = new Date();
        const newTruck = {
          id: Date.now().toString(),
          number: number,
          firstWeight: weight,
          firstTime: now.toLocaleTimeString('ar-EG'),
          firstDate: now.toLocaleDateString('ar-EG'),
          firstImage: `images/print/${imageId}_cam1.jpg`,
          secondWeight: null,
          secondTime: null,
          secondDate: null,
          secondImage: null,
          netWeight: null,
          netCalculated: false,
          images: imageId,
          customer: customer,
          type: type
        };

        allTrucks.unshift(newTruck);
        saveTrucks();
        filterAndDisplayTrucks();
        
        document.getElementById('newTruckNumber').value = '';
        focusInput();
        
        showToast(`تم إضافة السيارة رقم ${number}`, 'success');
      } catch (error) {
        console.error('خطأ:', error);
        showToast('حدث خطأ أثناء الإضافة', 'error');
      } finally {
        showLoading(false);
      }
    }

    // التقاط الوزن الثاني بقيمة محددة
    async function captureSecondWeightWithValue(id, weight) {
      const truck = allTrucks.find(t => t.id === id);
      if (!truck) return;

      if (truck.secondWeight) {
        showToast('تم أخذ الوزن الثاني مسبقاً', 'warning');
        return;
      }

      showLoading(true);
      
      try {
        const imageId = truck.images || `${Date.now()}_${truck.number}_second`;
        
        try {
          await fetch(`/capture-images/${imageId}/second`);
        } catch (e) {
          console.log('فشل التقاط الصور:', e);
        }

        const now = new Date();
        truck.secondWeight = weight;
        truck.secondTime = now.toLocaleTimeString('ar-EG');
        truck.secondDate = now.toLocaleDateString('ar-EG');
        truck.secondImage = `images/print/${imageId}_cam1.jpg`;
        truck.netWeight = Math.abs(truck.firstWeight - truck.secondWeight);
        truck.netCalculated = true;
        truck.images = imageId;
        
        if (!truck.customer) truck.customer = document.getElementById('globalCustomer').value;
        if (!truck.type) truck.type = document.getElementById('globalType').value;
        
        saveTrucks();
        filterAndDisplayTrucks();
        
        showToast(`الصافي: ${truck.netWeight} كجم`, 'success');
        
        setTimeout(() => printTicket(id), 1000);
      } catch (error) {
        console.error('خطأ:', error);
        showToast('حدث خطأ أثناء التسجيل', 'error');
      } finally {
        showLoading(false);
      }
    }

    // التقاط الوزن الثاني (للوزن التلقائي)
    async function captureSecondWeight(id) {
      await captureSecondWeightWithValue(id, currentWeight);
    }

    // فتح صورة في المعرض
    function openImage(src, caption) {
      const modal = document.getElementById('imgModal');
      const modalImg = document.getElementById('modalImg');
      const modalCaption = document.getElementById('modalCaption');
      modalImg.src = src;
      modalCaption.textContent = caption || '';
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    // إغلاق المعرض
    function closeModal(event) {
      const modal = document.getElementById('imgModal');
      if (!event || event.target === modal || event.target.classList.contains('modal-close')) {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    }

    // طباعة تذكرة
    function printTicket(id) {
      const truck = allTrucks.find(t => t.id === id);
      if (!truck || !truck.netWeight) return;

      const ticketData = {
        number: truck.number,
        gross: truck.firstWeight,
        tare: truck.secondWeight,
        net: truck.netWeight,
        date: truck.firstDate,
        time: truck.firstTime,
        customer: truck.customer || '',
        type: truck.type || '',
        images: truck.images,
        firstTime: truck.firstTime,
        secondTime: truck.secondTime
      };

      localStorage.setItem('ticketData', JSON.stringify(ticketData));
      window.open('ticket.html', '_blank', 'width=650,height=650');
    }

    // حذف سيارة
    function clearTruck(id) {
      if (!confirm('هل أنت متأكد من حذف هذه السيارة؟')) return;
      
      allTrucks = allTrucks.filter(t => t.id !== id);
      saveTrucks();
      filterAndDisplayTrucks();
      showToast('تم حذف السيارة', 'success');
    }

    // التبديل بين التبويبات
    function switchTab(tab) {
      currentTab = tab;
      displayLimit = 10;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const tabMap = {
        'all': 'tabAll',
        'first': 'tabFirst',
        'completed': 'tabCompleted'
      };
      document.getElementById(tabMap[tab]).classList.add('active');
      
      filterAndDisplayTrucks();
    }

    // تحميل المزيد
    function loadMore() {
      displayLimit += 10;
      filterAndDisplayTrucks();
    }

    // معالجة الضغط على Enter
    function handleEnterPress(event) {
      if (event.key === 'Enter') {
        addFirstWeight();
      }
    }

    // إظهار رسالة toast
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toastMessage');
      toast.textContent = message;
      toast.className = `toast-notification show bg-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'primary'} text-white`;
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // إظهار/إخفاء شاشة التحميل
    function showLoading(show) {
      const loadingScreen = document.getElementById('loadingScreen');
      loadingScreen.style.display = show ? 'flex' : 'none';
    }

    // إغلاق نافذة الوزن اليدوي بالضغط على ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
        closeManualWeightModal();
      }
    });
  </script>
</body>
</html>
