<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>نظام تحكم الميزان المتطور</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Tajawal', sans-serif;
    }

    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #303db4 0%, #504eda 100%);
      --success-gradient: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
      --danger-gradient: linear-gradient(135deg, #f43b47 0%, #453a94 100%);
      --dark-gradient: linear-gradient(135deg, #141e30 0%, #243b55 100%);
      --glass-bg: rgba(255, 255, 255, 0.25);
      --glass-border: 1px solid rgba(255, 255, 255, 0.18);
    }

    body {
      background: var(--primary-gradient);
      min-height: 100vh;
      padding-top: 70px;
      padding-bottom: 20px;
    }

    /* شريط التنقل المحسن */
    .navbar-modern {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border-bottom: var(--glass-border);
    }

    .navbar-modern .navbar-brand {
      font-weight: 900;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.5rem;
    }

    /* بطاقة الوزن الرئيسية */
    .weight-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 8px;
      margin-bottom: 8px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: var(--glass-border);
      text-align: center;
    }

    .weight-display {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      margin: 5px 0;
    }

    .weight-unit {
      font-size: 1.2rem;
      color: #666;
      margin-right: 10px;
    }

    .weight-label {
      font-size: 1rem;
      color: #888;
      letter-spacing: 2px;
    }

    /* بطاقات الإعدادات */
    .settings-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 15px;
      border: var(--glass-border);
      transition: all 0.3s ease;
    }

    .settings-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .settings-icon {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: var(--primary-gradient);
      color: white;
    }

    /* أزرار التحكم السريع */
    .quick-action-btn {
      background: var(--primary-gradient);
      border: none;
      border-radius: 15px;
      padding: 15px;
      color: white;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .quick-action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
    }

    .quick-action-btn i {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    /* لوحة المفاتيح الرقمية */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px;
    }

    .keypad-btn {
      aspect-ratio: 1.5;
      border-radius: 15px;
      border: none;
      background: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      font-size: 1.5rem;
      font-weight: 700;
      color: #333;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .keypad-btn:active {
      transform: scale(0.95);
      background: var(--primary-gradient);
      color: white;
    }

    .keypad-btn.special {
      background: var(--primary-gradient);
      color: white;
      font-size: 1.2rem;
    }

    /* صندوق الردود */
    .response-box {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 15px;
      color: #0ff;
      font-family: 'Courier New', monospace;
      height: 200px;
      overflow-y: auto;
      font-size: 0.9rem;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1);
    }

    .response-box::-webkit-scrollbar {
      width: 5px;
    }

    .response-box::-webkit-scrollbar-thumb {
      background: var(--primary-gradient);
      border-radius: 10px;
    }

    /* تذييل الصفحة */
    .footer-links {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 50px;
      padding: 10px;
      margin-top: 20px;
    }

    .footer-links a {
      color: #333;
      text-decoration: none;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 50px;
      transition: all 0.3s ease;
    }

    .footer-links a:hover {
      background: var(--primary-gradient);
      color: white;
    }

    /* معرض الصور المنبثق */
    .img-gallery-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      z-index: 9999;
      padding: 20px;
    }

    .gallery-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .gallery-close {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      z-index: 10000;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* زر الـ Floating Action */
    .fab-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: white;
      border: none;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.6);
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .fab-button:hover {
      transform: scale(1.1) rotate(90deg);
    }

    /* تحسينات للجوال */
    @media (max-width: 768px) {
      body {
        padding-top: 60px;
      }

      .weight-display {
        font-size: 3rem;
      }

      .keypad-btn {
        font-size: 1.2rem;
      }

      .settings-card {
        padding: 10px;
      }

      .settings-icon {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }
    }

    /* أنيميشن للوزن */
    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    .weight-pulse {
      animation: pulse 0.5s ease;
    }

    /* Switch مخصص */
    .custom-switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .custom-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background: var(--primary-gradient);
    }

    input:checked+.slider:before {
      transform: translateX(26px);
    }
  </style>
</head>

  <!-- السكربتات -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    // تهيئة Socket.IO
    const socket = io();
    let streamEnabled = false;
    let count = 0;

    // وظائف مساعدة
    function clearInput(id) {
      document.getElementById(id).value = '';
    }

    function clearType() {
      document.getElementById('type').value = '';
    }

    function clearCustomer() {
      document.getElementById('customer').value = '';
    }

    // تحديث واجهة البث
    function updateStreamUI() {
      const status = document.getElementById("streamStatusText");
      if (streamEnabled) {
        status.innerHTML = "🟢 يعمل الآن";
        status.classList.remove("text-danger");
        status.classList.add("text-success");
      } else {
        status.innerHTML = "🔴 متوقف";
        status.classList.remove("text-success");
        status.classList.add("text-danger");
      }
    }

    // تشغيل/إيقاف البث
    function toggleStreamMonter(element) {
      streamEnabled = element.checked;
      sendCommand(streamEnabled ? 'SX' : 'EX');
      updateStreamUI();
    }

    // تحميل حالة الطباعة
    async function loadPrintStatus() {
      const res = await fetch("/get-print");
      const data = await res.json();
      document.getElementById("printToggle").checked = data.print === 1;
      updatePrintUI();
    }

    function updatePrintUI() {
      const status = document.getElementById("printStatusText");
      if (document.getElementById("printToggle").checked) {
        status.innerHTML = "🟢 تعمل";
        status.classList.remove("text-danger");
        status.classList.add("text-success");
      } else {
        status.innerHTML = "🔴 متوقفة";
        status.classList.remove("text-success");
        status.classList.add("text-danger");
      }
    }

    async function togglePrint(element) {
      await fetch(`/set-print/${element.checked ? 1 : 0}`);
      updatePrintUI();
    }

    // تحميل حالة الصوت
    async function loadSoundStatus() {
      const res = await fetch("/get-sound");
      const data = await res.json();
      document.getElementById("soundToggle").checked = data.sound === 1;
      updateSoundUI();
    }

    function updateSoundUI() {
      const status = document.getElementById("soundStatus");
      const status1 = document.getElementById("soundStatus1");
      if (document.getElementById("soundToggle").checked) {
        status.innerHTML = "🔊 نشط";
        status1.innerHTML = '<i class="fas fa-volume-up"></i>';
      } else {
        status.innerHTML = "🔇 متوقف";
        status1.innerHTML = '<i class="fas fa-volume-mute"></i>';
      }
    }

    async function toggleSound(element) {
      await fetch(`/set-sound/${element.checked ? 1 : 0}`);
      updateSoundUI();
    }

    // تحميل حالة الإشعارات
    async function loadNotifyStatus() {
      const res = await fetch("/get-notify");
      const data = await res.json();
      document.getElementById("notifyToggle").checked = data.notify === 1;
      updateNotifyUI();
    }

    function updateNotifyUI() {
      const status = document.getElementById("notifyStatusText");
      if (document.getElementById("notifyToggle").checked) {
        status.innerHTML = "🟢 تعمل";
        status.classList.remove("text-danger");
        status.classList.add("text-success");
      } else {
        status.innerHTML = "🔴 متوقفة";
        status.classList.remove("text-success");
        status.classList.add("text-danger");
      }
    }

    async function toggleNotify(element) {
      await fetch(`/set-notify/${element.checked ? 1 : 0}`);
      updateNotifyUI();
    }

    // إرسال أمر
    function sendCommand(command) {
      const type = document.getElementById('type').value;
      const customer = document.getElementById('customer').value;

      fetch(`/send-command?command=${command}&type=${type}&customer=${customer}`)
        .then(() => {
          if (command == 'Kid' || command == 'KPRINT') {
            document.getElementById('type').value = '';
            document.getElementById('customer').value = '';
          }
        });
    }

    function sendTextCommand() {
      const inputValue = document.getElementById("edpInput").value;
      if (inputValue) {
        fetch(`/send-command?command=${inputValue}`);
      }
    }

    // استقبال الردود
    socket.on('response', (data) => {
      if (data.length == 11 || data.length == 12) {
        const weightDisplay = document.getElementById('response');
        weightDisplay.innerHTML = `${data} <span class="weight-unit">كجم</span>`;
        // weightDisplay.classList.add('weight-pulse');
        setTimeout(() => weightDisplay.classList.remove('weight-pulse'), 500);
      } else {
        const box = document.getElementById('response1');
        box.innerHTML += `→ ${data}\n`;
        box.scrollTop = box.scrollHeight;

        if (data.slice(-2).toUpperCase() === "NE") {
          document.getElementById('response11').innerHTML = `<span class="badge bg-primary">${data}</span>`;
        }
      }
    });

    // استقبال التذاكر الجديدة
    socket.on('printer:new', (row) => {
      setTimeout(() => {
        const tableBody = document.getElementById('data-table2');
        tableBody.innerHTML = `
          <div class="text-center">
            <div class="mb-2">
              <img src="images/print/${row.images}_cam1.jpg" 
                   style="max-width:100%; border-radius:10px; cursor:pointer;"
                   onclick="openImg(this.src, 'رقم: ${row.number} - الوزن: ${row.net} كجم')">
            </div>
            <div class="d-flex justify-content-around mb-2">
              <span class="badge bg-primary">رقم: ${row.number}</span>
              <span class="badge bg-success">صافي: ${row.net}</span>
            </div>
            <button class="btn btn-primary btn-sm w-100" onclick='printTicket(${JSON.stringify(row).replace(/'/g, "&#39;")})'>
              <i class="fas fa-print"></i> طباعة
            </button>
          </div>
        `;
      }, 500);
    });

    socket.on('id:new', (row) => {
      setTimeout(() => {
        const tableBody = document.getElementById('data-table2');
        tableBody.innerHTML = `
          <div class="text-center">
            <div class="mb-2">
              <img src="images/sensor/${row.images}_cam1.jpg" 
                   style="max-width:100%; border-radius:10px; cursor:pointer;"
                   onclick="openImg(this.src, 'رقم: ${row.NE} - الوزن: ${row.gross} كجم')">
            </div>
            <div class="d-flex justify-content-around">
              <span class="badge bg-info">رقم: ${row.NE}</span>
              <span class="badge bg-warning">وزن: ${row.gross}</span>
            </div>
          </div>
        `;
      }, 500);
    });

    socket.on('play-audio', (fileName) => {
      const audioPlayer = document.getElementById('audioPlayer');
      audioPlayer.src = `/audio/${fileName}`;
      audioPlayer.play();
    });

    // وظائف الصور
    function openImg(src, head) {
      if (head) document.getElementById("head").innerHTML = head;
      document.getElementById("modalImg").src = src;
      document.getElementById("imgModal").style.display = "flex";
      document.body.style.overflow = 'hidden';
    }

    function closeImg(event) {
      if (!event || event.target === document.getElementById('imgModal')) {
        document.getElementById("imgModal").style.display = "none";
        document.body.style.overflow = 'auto';
      }
    }

    function printTicket(row) {
      localStorage.setItem("ticketData", JSON.stringify(row));
      window.open("ticket.html", "_blank", "width=650,height=650");
    }

    function takeScreenshot() {
      html2canvas(document.body, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'screenshot.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // تحميل جميع الحالات عند بدء التشغيل
    window.onload = function () {
      streamEnabled = true;
      updateStreamUI();
      loadPrintStatus();
      loadSoundStatus();
      loadNotifyStatus();
      setInterval(() => sendCommand('p'), 1000);
    };
  </script>

</body>

</html>
