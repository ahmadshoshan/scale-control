<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <title>طباعة التذكرة</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: "Arial", "Tahoma", sans-serif;
      width: 80mm;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: #000;
    }

    .center {
      text-align: center;
    }

    .small0 {
      font-size: 13px;
    }

    .small {
      font-size: 15px;
    }

    .medium {
      font-size: 17px;
    }

    .large {
      font-size: 18px;
    }

    .large2 {
      font-size: 25px;
    }

    .bold {
      font-weight: 700;
    }

    .line {
      border-top: 1px dashed #000;
      margin: 6px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      direction: rtl;
      font-size: 14px;
    }

    td {
      padding: 4px 3px;
      vertical-align: middle;
      border: 1px solid #000;
    }

    .label {
      width: 30%;
      font-weight: bold;
    }

    .value {
      width: 35%;
    }

    @media print {
      @page {
        size: 70mm auto;
        margin: 0;
      }

      body {
        width: 70mm;
        margin: 0;
        padding: 6px;
      }
    }
  </style>
</head>

<body class="print-ticket">

  <div class="center">
    <img src="logo/logo.png" alt="شعار الميزان" style="max-width:120px; height:auto; margin-bottom:6px;">
  </div>

  <h1 class="center bold">ميزان بسكول شوشان</h1>
  <h3 class="center small">العنوان مدخل أبوغنيمة ت: 01099760031</h3>
  <div class="line"></div>

  <table>
    <tr>
      <td class="label">التاريخ :</td>
      <td class="value center" id="date"></td>

      <td class="value center" id="time"></td>
    </tr>
    <!-- <tr>
      <td class="label">المسلسل :</td>
      <td class="value center" id="sn"></td>
    </tr> -->
    <tr>
      <td class="label">رقم السيارة :</td>
      <td class="value large bold center" id="number" colspan="3"></td>
    </tr>

    <tr>
      <td class="label">اسم العميل :</td>
      <td class="value large bold center" id="customer" colspan="3"></td>
    </tr>

  </table>
  <hr>
  <table>
    <tr>
      <td class="label large">النوع :</td>
      <td class="value large bold center" id="type"></td>
      <td class="value  bold large center" id="extra_type"></td>

    </tr>
    <tr>
      <td class="label large bold">القائم :</td>
      <td class="value large bold center" id="gross"></td>
      <td class="value large bold center" id="extra_gross">كجم</td>
    </tr>
    <tr>
      <td class="label large bold">الفارغ :</td>
      <td class="value large bold center" id="tare"></td>
      <td class="value large bold center" id="extra_tare">كجم</td>
    </tr>
    <tr>
      <td class="label large bold">الصافي :</td>
      <td class="value large bold center">
        <div class="large2" id="net"></div>
      </td>
      <td class="value large bold center">
        <div class="large2" id="extra_net">كجم</div>
      </td>
    </tr>
  </table>
  <!-- <hr> -->

  <!-- <div class="center small" id="total"></div> -->
  <div class="center small" id="note"></div>
  <div class="center small" id="extraWeightsTable"></div>
  <div id="tableBody"></div>

  <div class="line"></div>

  <div class="center small">الميزان غير مسئول عن فقدان الكارت</div>

  <script>
    function toArabicNumbers(input) {
      input = input.toString().trim();
      if (input.includes("/") || input.includes(":")) {
        return input.replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
      }
      let onlyNumbers = input.replace(/[^0-9]/g, '');
      return onlyNumbers.replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
    }

    // قراءة البيانات من localStorage
    const row = JSON.parse(localStorage.getItem("ticketData"));

    if (row) {
      document.getElementById("date").textContent = toArabicNumbers(row.date || '');
      document.getElementById("time").textContent = toArabicNumbers(row.time || '');
      // document.getElementById("sn").textContent = toArabicNumbers(row.sn || '');
      document.getElementById("number").textContent = toArabicNumbers(row.number || '');
      document.getElementById("gross").textContent = toArabicNumbers(row.gross || '') ;
      document.getElementById("tare").textContent = toArabicNumbers(row.tare || '') ;
      document.getElementById("net").textContent = toArabicNumbers(row.net || '') ;
      document.getElementById("type").textContent = row.type || '';
      document.getElementById("customer").textContent = row.customer || '';
      // document.getElementById("total").textContent = row.total || '';
      document.getElementById("note").textContent = row.note || '';
      if (row.extraWeightsTable) {

        let extra = row.extraWeightsTable;

        if (typeof extra === "string") {
          extra = JSON.parse(extra);
        }
        document.getElementById("extra_gross").textContent = toArabicNumbers(extra.secondWeight) +"كجم";
        document.getElementById("extra_tare").textContent = toArabicNumbers(extra.thirdWeight) +"كجم";
        document.getElementById("extra_net").textContent = toArabicNumbers(extra.finalNetWeight)+"كجم" ;
        document.getElementById("extra_type").textContent = extra.extraEditType;

        document.getElementById("extraWeightsTable").innerHTML = `

   <div class="line">
    <table>

    <tr>
      <td class="label large bold">الاجمالي </td>
      <td class="value large bold center">${toArabicNumbers(extra.totalNetWeight)} كجم</td>
    </tr>
  </table>
  `;
      }

      if (row.price > 0) {

        ///////////////////////////////////////////////////////////////////

        const net = parseFloat(row.net);
        const price = parseFloat(row.price);
        const unitWeight = parseFloat(row.unitWeight);

        const total = (net * price) / unitWeight;

        const units = Math.floor(net / unitWeight);
        const remain = net % unitWeight;

        document.getElementById("tableBody").innerHTML = `

<div class="row mb-2">
  <label class="col-12 col-form-label fw-bold text-center">تفاصيل الحساب</label>
  <div class="col-12">

    <table >
      <tbody >
        <tr>
        
          <td class="label">سعر الوحدة</td>
          <td class="label">وزن الوحدة</td>
          <td class="label">عدد الوحدات</td>
          <td class="label">الباقي</td>
          <td class="label">الإجمالي</td>
        </tr>
      </tbody>

      <tbody >
        <tr>
     
      <td class="value center" >${price}</td>
      <td class="value center" >${unitWeight}</td>
      <td class="value center" >${units}</td>
      <td class="value center" >${remain} كجم</td>
      <td class="value center" >${total.toFixed(2)} جنيه</td>
    </tr>
      </tbody>
    </table>

  </div>
</div>

 
  `;
      }
    }









    // // اطبع تلقائي بعد التحميلPrice
    // window.onload = function() {
    //   setTimeout(() => {
    //     window.print();
    //   }, 200);
    // };


  </script>
  <script>
    window.onload = function () {
      window.print();
      setTimeout(() => {
        window.close();
      }, 2000); // ثانيتين بعد الطباعة
    };
  </script>

</body>

</html>
