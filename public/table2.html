<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جدول التذاكر</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 16px;
    }

    .print-btn {
      min-width: 90px;
    }

    @media print {
      @page {
        size: 80mm auto;
        margin: 0mm;
      }

      body.print-ticket {
        margin: 0;
        width: 80mm;
      }
    }
  </style>
</head>

<body class="container mt-5">
  <div class="mb-3">
    <a href="index.html" class="btn btn-secondary">⬅ رجوع للوحة التحكم</a>
  </div>

  <h2>عرض بيانات التذاكر</h2>

  <!-- مربع بحث -->
  <div class="input-group mb-3">
    <select id="searchType" class="form-select" style="max-width: 200px;">
      <option value="number">رقم السيارة</option>
      <option value="date">التاريخ</option>
      <option value="sn">المسلسل</option>
    </select>

    <input id="searchValue" type="text" placeholder="اكتب هنا" class="form-control">
    <button type="button" class="btn btn-secondary" onclick="fetchData3()">بحث</button>
    <button type="button" class="btn btn-outline-danger" onclick="clearSearch()">مسح</button>
  </div>

  <table id="data-table2" class="table table-striped">
    <thead>
      <tr>
        <th>التاريخ</th>
        <th>المسلسل</th>
        <th>رقم السيارة</th>
        <th>الوزن الاول</th>
        <th>الوزن الثاني</th>
        <th>الصافي</th>
        <th>العميل والنوع</th>
        <th>خيارات</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button id="load-more-btn2" class="btn btn-success w-100">تحميل المزيد</button>

  <!-- نافذة التعديل -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">تعديل التذكرة</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="editId">
            <div class="mb-2">
              <label>رقم السيارة:</label>
              <input type="text" id="editNumber" class="form-control">
            </div>
            <div class="mb-2">
              <label>العميل:</label>
              <input list="customers" type="text" id="editCustomer" class="form-control"placeholder=" العميل">
              <datalist id="customers">
                <option value="الحاج خالد عبد السلام">
                <option value="عماد نوح">
                <option value="محمد الصندفاوي">
                <option value="محمد منصور">
                <option value="محمود نصير">
                <option value="هاني عبد الباعث">
                <option value="الشحات عبد الباعث">
                <option value="احمدعلي ">
                <option value="علي محروس ">
                <option value="محمود ابومنصور  ">
              </datalist>
            </div>
            <div class="mb-2">
              <label>النوع:</label>
              <input list="types" type="text" id="editType" class="form-control"placeholder=" النوع">
             
            <datalist id="types">
            <option value="أرز">
              <option value="غلة">
              <option value="تبن">
              <option value="خشب">
              <option value=" خشب صنعه">
              <option value=" خشب حريق">
              <option value=" خشب ناشف">
              <option value="لب">
              <option value="فول">
            </datalist>
            </div>
            <div class="mb-2">
              <label>الوزن الأول:</label>
              <input type="text" id="editGross" class="form-control">
            </div>
            <div class="mb-2">
              <label>الوزن الثاني:</label>
              <input type="text" id="editTare" class="form-control">
            </div>
            <div class="mb-2">
              <label>الصافي:</label>
              <input type="text" id="editNet" class="form-control">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" class="btn btn-primary" onclick="updateData()">حفظ التعديل</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
   <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

socket.on('printer:new', (row) => {
  console.log('🆕 تذكرة جديدة:', row);

  const tableBody = document.querySelector('#data-table2 tbody');

  const tr = document.createElement('tr');

  const printBtnHtml = `
    <button class="btn btn-outline-primary btn-sm" onclick='printTicket(${JSON.stringify(row).replace(/'/g, "&#39;")})'>طباعه🖨</button>
    <button class="btn btn-outline-warning btn-sm" onclick='openEdit(${JSON.stringify(row).replace(/'/g, "&#39;")})'>✏</button>
  `;

  tr.innerHTML = `
    <td>${row.date}<br>${row.time}</td>
    <td>${row.sn}</td>
    <td>${row.number}</td>
    <td>${row.gross}</td>
    <td>${row.tare}</td>
    <td>${row.net}</td>
    <td>${row.customer || ''} -- ${row.type || ''}</td>
    <td >${printBtnHtml}</td>
  `;

  // 🔥 أضف الصف في أول الجدول
  tableBody.prepend(tr);
});

  //////////////////////////////////////////
    let offset2 = 0;
    const limit2 = 5;

    async function fetchData2() {
      try {
        const response = await fetch(`/get-data2?limit=${limit2}&offset=${offset2}`);
        const data = await response.json();
        const tableBody = document.querySelector('#data-table2 tbody');

        if (data.length === 0) {
          document.getElementById('load-more-btn2').style.display = 'none';
          return;
        }

        data.forEach(row => {
          const tr = document.createElement('tr');
          const printBtnHtml = `<button class="btn btn-outline-primary btn-sm print-btn" onclick='printTicket(${JSON.stringify(row).replace(/'/g, "&#39;")})'>🖨</button>`;
        const printDirectBtnHtml = `<button class="btn btn-outline-success btn-sm print-btn" onclick='printTicketDirect(${row.id})'>🖨️ مباشر</button>`;
          const editBtnHtml = `<button class="btn btn-outline-warning btn-sm" onclick='openEdit(${JSON.stringify(row).replace(/'/g, "&#39;")})'>✏</button>`;
          // console.log(row);

  tr.innerHTML = `
  <td>${row.date}<br>${row.time}</td>
  <td>${row.sn}</td>
  <td>${row.number}</td>
  <td>${row.gross}</td>
  <td>${row.tare}</td>
  <td>${row.net}</td>
  <td>${row.customer} -- ${row.type}</td>
  <td>
    ${printBtnHtml}
    ${printDirectBtnHtml}
    ${editBtnHtml}
  </td>
`;
          
          tableBody.appendChild(tr);
        });

        offset2 += limit2;
      } catch (error) {
        console.error('خطأ:', error);
      }
    }

    function openEdit(row) {
      document.getElementById('editId').value = row.id;
      document.getElementById('editNumber').value = row.number;
      document.getElementById('editCustomer').value = row.customer;
      document.getElementById('editType').value = row.type;
      document.getElementById('editGross').value = row.gross;
      document.getElementById('editTare').value = row.tare;
      document.getElementById('editNet').value = row.net;

      const modal = new bootstrap.Modal(document.getElementById('editModal'));
      modal.show();
    }

    async function updateData() {
      const id = document.getElementById('editId').value;
      const updatedData = {
        number: document.getElementById('editNumber').value,
        customer: document.getElementById('editCustomer').value,
        type: document.getElementById('editType').value,
        gross: document.getElementById('editGross').value,
        tare: document.getElementById('editTare').value,
        net: document.getElementById('editNet').value
      };

      try {
        const response = await fetch(`/update-ticket/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedData)
        });
        if (response.ok) {
          alert('✅ تم تحديث التذكرة بنجاح');
          location.reload();
        } else {
          alert('❌ حدث خطأ أثناء التحديث');
        }
      } catch (error) {
        console.error('خطأ:', error);
      }
    }

    function printTicket(row) {
      localStorage.setItem("ticketData", JSON.stringify(row));
      window.open("ticket.html", "_blank", "width=800,height=600");
    }

    window.onload = fetchData2;
    document.getElementById('load-more-btn2').addEventListener('click', fetchData2);




     // طباعة بحث برقم العربية
    async function fetchData3() {
      const searchType = document.getElementById('searchType').value;
      const searchValue = document.getElementById('searchValue').value;
      console.log(searchType);
      console.log(searchValue);
      try {
        const response = await fetch(`/get-data3?type=${encodeURIComponent(searchType)}&value=${encodeURIComponent(searchValue)}`);
        const data = await response.json();
        const tableBody = document.querySelector('#data-table2 tbody');
        tableBody.innerHTML = "";

        if (data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">لا توجد نتائج</td></tr>`;
          return;
        }

        data.forEach(row => {
          const tr = document.createElement('tr');
          const printBtnHtml = `<button class="btn btn-outline-primary print-btn" onclick='printTicket(${JSON.stringify(row).replace(/'/g, "&#39;")})'>طباعة</button>`;

          tr.innerHTML = `
             <td>${row.date}<br> ${row.time}</td>
           
            <td>${row.sn}</td>
            <td>${row.number}</td>
            <td>${row.gross}</td>
            <td>${row.tare}</td>
            <td>${row.net}</td>
            <td>${row.customer} -- ${row.type}</td>
            <td>${printBtnHtml}</td>
          `;
          tableBody.appendChild(tr);
        });

      } catch (error) {
        console.error('خطأ:', error);
      }
    }

    function clearSearch() {
      document.getElementById('carNumber').value = "";
      document.querySelector('#data-table2 tbody').innerHTML = "";
      offset2 = 0;
      fetchData2();
    }




    async function printTicketDirect(id) {
  if (!confirm("هل أنت متأكد من طباعة هذه التذكرة مباشرة؟")) return;

  try {
    const response = await fetch(`/print-ticket-direct/${id}`, {
      method: 'POST'
    });

    const result = await response.json();
    if (result.success) {
      alert('✅ تم إرسال أمر الطباعة بنجاح!');
    } else {
      alert('❌ فشل في الطباعة: ' + (result.message || 'خطأ غير معروف'));
    }
  } catch (error) {
    console.error('خطأ في طباعة التذكرة:', error);
    alert('❌ حدث خطأ أثناء محاولة الطباعة.');
  }
}
  </script>



</body>

</html>
