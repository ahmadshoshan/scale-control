  <script>
    const typeInput = document.getElementById("editType");
    const priceInput = document.getElementById("editPrice");
    const netInput = document.getElementById("editNet");
    const totalInput = document.getElementById("editTotal");
    const typesList = document.getElementById("types");

    function getUnitWeight(typeName) {
      const option = Array.from(typesList.options)
        .find(o => o.value === typeName);
      return option ? parseFloat(option.dataset.unit) : 0;
    }

    function calculateTotal() {
      const net = parseFloat(netInput.value);
      const price = parseFloat(priceInput.value);
      const unitWeight = getUnitWeight(typeInput.value);



      document.getElementById("editType").addEventListener("input", function () {
        const value = this.value.trim();
        let unitWeight = 0;

        // لو المستخدم كتب رقم → وزن يدوي
        if (!isNaN(value) && value !== "") {
          unitWeight = parseFloat(Number(value));
        }

        const total = (net * price) / unitWeight;
        totalInput.value = total.toFixed(2);

        // console.log("وزن الوحدة:", unitWeight);
      });


      if (!net || !price || !unitWeight) {
        totalInput.value = "";
        return;
      }

      const total = (net * price) / unitWeight;

      totalInput.value = `(الصافي: ${net} × السعر: ${price}) ÷ الوحدة: ${unitWeight} = ${total.toFixed(2)} جنية || ${Math.floor(net / unitWeight)} وحدة  (باقي: ${(net % unitWeight)})كيلو`;
    }


    typeInput.addEventListener("input", calculateTotal);
    priceInput.addEventListener("input", calculateTotal);
    netInput.addEventListener("input", calculateTotal);

  </script>

    function openEdit(row) {
      document.getElementById('editId').value = row.id;

      document.getElementById('editType').value = row.type;
      document.getElementById('editGross').value = row.gross;

    async function updateData() {

        number: document.getElementById('editNumber').value,
        customer: document.getElementById('editCustomer').value,
        type: document.getElementById('editType').value,
        gross: document.getElementById('editGross').value,
        tare: document.getElementById('editTare').value,
        net: document.getElementById('editNet').value,
        total: document.getElementById('editTotal').value
      };

      try {
        const response = await fetch(`/update-ticket/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedData)
        });
        if (response.ok) {
          alert('✅ تم تحديث التذكرة بنجاح');
          location.reload();
        } else {
          alert('❌ حدث خطأ أثناء التحديث');
        }
      } catch (error) {
        console.error('خطأ:', error);
      }
    }

    async function printTicketDirect(id) {
      if (!confirm("هل أنت متأكد من طباعة هذه التذكرة مباشرة؟")) return;

      try {
        const response = await fetch(`/print-ticket-direct/${id}`, {
          method: 'POST'
        });

        const result = await response.json();
        if (result.success) {
          alert('✅ تم إرسال أمر الطباعة بنجاح!');
        } else {
          alert('❌ فشل في الطباعة: ' + (result.message || 'خطأ غير معروف'));
        }
      } catch (error) {
        console.error('خطأ في طباعة التذكرة:', error);
        alert('❌ حدث خطأ أثناء محاولة الطباعة.');
