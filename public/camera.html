<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاميرا الميزان</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        canvas {
            width: 100%;
            height: auto;
            background: #111;
            border: 2px solid #4CAF50;
            border-radius: 8px;
        }
        
        .info {
            color: white;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            font-size: 14px;
        }
        
        .status {
            color: #4CAF50;
            font-size: 12px;
            margin-top: 5px;
            text-align: center;
        }
        
        button {
            margin-top: 10px;
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="videoCanvas" width="640" height="480"></canvas>
        <div class="info" id="cameraName">جاري التحميل...</div>
        <div class="status" id="status">🟡 جاري الاتصال...</div>
        <button onclick="location.reload()">🔄 إعادة المحاولة</button>
    </div>

    <script src="js/jsmpeg.min.js"></script>
    
    <script>
        // الحصول على رقم الكاميرا من رابط الصفحة
        const urlParams = new URLSearchParams(window.location.search);
        let cameraId = urlParams.get('cam') || '1';
        
        // أسماء الكاميرات
        const cameraNames = {
            '1': '📹 الكاميرا الأمامية',
            '2': '📹 الكاميرا الخلفية',
            '3': '📹 الكاميرا الجانبية'
        };
        
        // تحديث عنوان الكاميرا
        document.getElementById('cameraName').innerHTML = cameraNames[cameraId] || `كاميرا ${cameraId}`;
        
        const wsUrl = `ws://${window.location.hostname}:3000`;
        const statusDiv = document.getElementById('status');
        
        function updateStatus(message, isError = false) {
            statusDiv.innerHTML = message;
            statusDiv.style.color = isError ? '#f44' : '#4CAF50';
            console.log(`Camera ${cameraId}:`, message);
        }
        
        updateStatus('🟡 جاري الاتصال بالخادم...');
        
        try {
            const player = new JSMpeg.Player(wsUrl, {
                canvas: document.getElementById('videoCanvas'),
                audio: false,
                videoBufferSize: 1024 * 1024 * 2,
                preserveDrawingBuffer: true,
                onPlay: () => {
                    updateStatus('🟢 بث مباشر');
                },
                onEnded: () => {
                    updateStatus('🔴 انقطع البث - جاري إعادة المحاولة...');
                    setTimeout(() => {
                        location.reload();
                    }, 3000);
                },
                onError: (error) => {
                    console.error('Error:', error);
                    updateStatus('❌ خطأ في الاتصال', true);
                }
            });
        } catch(error) {
            console.error('Player error:', error);
            updateStatus('❌ فشل تحميل البث', true);
        }
    </script>
</body>
</html>
